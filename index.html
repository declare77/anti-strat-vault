<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anti-Strat Vault</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#0F1923;
  --bg-raised:#141F29;
  --bg-card:#1B2733;
  --bg-card-hover:#20303D;
  --border:#293743;
  --border-strong:#3B4C59;
  --text:#ECE8E1;
  --text-dim:#93A2AD;
  --text-faint:#5C6C78;
  --accent:#FF4655;
  --accent-dim:#7A2530;
  --accent-soft:rgba(255,70,85,.14);
  --defense:#4FD1C5;
  --defense-dim:#1E4643;
  --defense-soft:rgba(79,209,197,.14);
  --warn:#FFB454;
  --grid-line:rgba(255,255,255,.018);
  --font-display:'Rajdhani',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}

[data-theme="light"]{
  --bg:#F3F0E8;
  --bg-raised:#FFFFFF;
  --bg-card:#FFFFFF;
  --bg-card-hover:#ECE6D8;
  --border:#DED6C3;
  --border-strong:#C2B8A2;
  --text:#1B2733;
  --text-dim:#57626C;
  --text-faint:#828C96;
  --accent:#E23A49;
  --accent-dim:#B92E3B;
  --accent-soft:rgba(226,58,73,.10);
  --defense:#0E8F80;
  --defense-dim:#0B6E63;
  --defense-soft:rgba(14,143,128,.10);
  --warn:#A66A0A;
  --grid-line:rgba(27,39,51,.035);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  background-image:
    linear-gradient(var(--bg),var(--bg)),
    repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 42px);
  transition:background-color .15s ease, color .15s ease;
}
::selection{background:var(--accent-soft); color:var(--text);}
button{font:inherit;color:inherit;}
input,textarea{font:inherit;color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:6px;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance;}

.app{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:100vh;
}

/* ---------- SIDEBAR ---------- */
.sidebar{
  background:var(--bg-raised);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  min-height:100vh;
  padding:20px 0 14px;
}
.brand{
  padding:0 18px 18px;
  border-bottom:1px solid var(--border);
  margin-bottom:14px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.brand .kicker{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.14em;
  color:var(--accent);
  display:block;
  margin-bottom:2px;
}
.brand .title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:22px;
  letter-spacing:.02em;
  line-height:1.05;
}
.theme-toggle{
  background:none;
  border:1px solid var(--border-strong);
  color:var(--text-dim);
  width:30px;height:30px;flex:none;
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  margin-top:1px;
}
.theme-toggle:hover{color:var(--text); background:var(--bg-card-hover); border-color:var(--accent-dim);}
.theme-toggle .icon-moon{display:none;}
[data-theme="light"] .theme-toggle .icon-sun{display:none;}
[data-theme="light"] .theme-toggle .icon-moon{display:block;}

.sidebar-section-label{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.12em;
  color:var(--text-faint);
  padding:0 18px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.add-team-btn{
  background:none;
  border:1px solid var(--border-strong);
  color:var(--text-dim);
  width:22px;height:22px;
  border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:.15s;
}
.add-team-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}

.add-team-row{
  padding:0 14px 10px;
  display:flex;
  gap:6px;
}
.add-team-row input{
  flex:1;
  min-width:0;
  background:var(--bg-card);
  border:1px solid var(--accent-dim);
  color:var(--text);
  padding:7px 9px;
  border-radius:3px;
  font-size:13px;
}
.add-team-row input:focus{border-color:var(--accent);}
.add-team-submit{
  flex:none;
  width:30px;
  background:var(--accent);
  border:1px solid var(--accent);
  color:#0F1923;
  border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.add-team-submit:hover{background:#ff5b68; border-color:#ff5b68;}
.add-team-submit:disabled{opacity:.4; cursor:default; background:var(--accent); border-color:var(--accent);}

.team-list{
  flex:1;
  overflow-y:auto;
  padding:0 8px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.team-row{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 10px;
  border-radius:3px;
  cursor:pointer;
  border:1px solid transparent;
  color:var(--text-dim);
}
.team-row:hover{background:var(--bg-card); color:var(--text);}
.team-row.active{background:var(--accent-soft); border-color:var(--accent-dim); color:var(--text);}
.team-row .dot{
  width:6px;height:6px;background:var(--border-strong);flex:none;
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
}
.team-row.active .dot{background:var(--accent);}
.team-row .name{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13.5px;
  font-weight:500;
}
.team-row .row-actions{
  display:none;
  gap:2px;
  flex:none;
}
.team-row:hover .row-actions{display:flex;}
.icon-btn{
  background:none;border:none;color:var(--text-faint);
  width:22px;height:22px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-btn:hover{color:var(--text); background:var(--bg-card-hover);}
.icon-btn.danger:hover{color:var(--accent);}
.team-rename-input{
  flex:1;
  background:var(--bg);
  border:1px solid var(--accent);
  color:var(--text);
  padding:5px 7px;
  border-radius:3px;
  font-size:13.5px;
  min-width:0;
}
.empty-teams{
  padding:16px 14px;
  color:var(--text-faint);
  font-size:12.5px;
  line-height:1.6;
}

.sidebar-footer{
  padding:12px 18px 0;
  border-top:1px solid var(--border);
  margin-top:10px;
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--text-faint);
  letter-spacing:.02em;
  display:flex;
  align-items:center;
  gap:6px;
}
.sidebar-footer .pulse{
  width:6px;height:6px;border-radius:50%;background:var(--defense);flex:none;
}
.sidebar-footer.local .pulse{background:var(--warn);}

.backup-row{
  padding:9px 18px 0;
  display:flex;
  gap:7px;
}
.backup-btn{
  flex:1;
  display:flex; align-items:center; justify-content:center; gap:5px;
  background:var(--bg-card);
  border:1px solid var(--border-strong);
  color:var(--text-dim);
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:.05em;
  padding:6px 4px;
  border-radius:3px;
  cursor:pointer;
}
.backup-btn:hover{color:var(--text); background:var(--bg-card-hover); border-color:var(--accent-dim);}
.backup-status{
  padding:7px 18px 0;
  font-family:var(--font-mono);
  font-size:10.5px;
  line-height:1.5;
  color:var(--text-faint);
  min-height:1px;
}
.backup-status.error{color:var(--accent);}
.backup-status.ok{color:var(--defense);}

/* ---------- MAIN ---------- */
.main{display:flex; flex-direction:column; min-width:0;}
.topbar{
  padding:16px 28px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  min-height:26px;
}
.crumb{
  font-family:var(--font-display);
  font-weight:600;
  font-size:15px;
  color:var(--text-faint);
  background:none;border:none;cursor:pointer;
  padding:2px 0;
}
.crumb.current{color:var(--text); cursor:default;}
.crumb:hover:not(.current){color:var(--text);}
.crumb-sep{color:var(--border-strong); font-size:14px;}

.content{
  flex:1;
  padding:26px 28px 60px;
  overflow-y:auto;
}

/* ---------- WELCOME / EMPTY ---------- */
.welcome{
  max-width:760px;
}
.welcome h2{font-size:26px; margin-bottom:8px;}
.welcome p{color:var(--text-dim); max-width:520px; margin:0 0 22px;}
.welcome .cta{
  background:var(--accent);
  color:#0F1923;
  border:none;
  font-family:var(--font-display);
  font-weight:700;
  font-size:14px;
  letter-spacing:.02em;
  padding:11px 20px;
  border-radius:3px;
  cursor:pointer;
  clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 100%, 0 100%);
}
.welcome .cta:hover{background:#ff5b68;}
.example-tag{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.1em;
  color:var(--warn);
  border:1px solid var(--warn);
  padding:2px 8px;
  border-radius:2px;
  margin-bottom:14px;
}
.example-panel{
  border:1px solid var(--border);
  background:var(--bg-raised);
  border-radius:4px;
  padding:20px;
  opacity:.82;
  pointer-events:none;
  max-width:640px;
}
.example-panel .ex-head{
  display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;
}
.example-panel .ex-head h3{font-size:18px;}
.example-panel .ex-side{font-family:var(--font-mono); font-size:11px; color:var(--accent); letter-spacing:.1em;}
.example-panel .ex-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.example-panel .ex-card{background:var(--bg-card); border:1px solid var(--border); border-radius:3px; padding:10px 12px;}
.example-panel .ex-card .ex-slot{font-family:var(--font-mono); font-size:9.5px; color:var(--text-faint); letter-spacing:.08em;}
.example-panel .ex-card .ex-title{font-family:var(--font-display); font-weight:600; font-size:14px; margin:2px 0 4px;}
.example-panel .ex-card .ex-notes{font-size:12px; color:var(--text-dim); line-height:1.5;}

/* ---------- MAP GRID ---------- */
.grid-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
.grid-header h2{font-size:24px;}
.grid-header .overall{font-family:var(--font-mono); font-size:12px; color:var(--text-dim);}
.grid-header .overall b{color:var(--text);}

.map-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
  gap:14px;
}
.map-tile{
  position:relative;
  background:var(--bg-card) center/cover no-repeat;
  border:1px solid var(--border);
  padding:18px 16px 16px;
  cursor:pointer;
  clip-path:polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
  transition:.15s;
  display:flex; flex-direction:column; justify-content:flex-end; gap:10px;
  min-height:168px;
  isolation:isolate;
  overflow:hidden;
}
.map-tile::before{
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(15,25,35,.15) 0%, rgba(13,20,28,.55) 55%, rgba(11,17,23,.92) 100%);
  z-index:0;
  transition:.15s;
}
.map-tile:hover::before{background:linear-gradient(180deg, rgba(15,25,35,.05) 0%, rgba(13,20,28,.45) 55%, rgba(11,17,23,.88) 100%);}
.map-tile:hover{border-color:var(--border-strong);}
.map-tile > *{position:relative; z-index:1;}
.map-tile .map-name{font-family:var(--font-display); font-weight:700; font-size:21px; letter-spacing:.01em; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.5);}
.map-tile .map-meta{
  display:flex; align-items:center; justify-content:space-between;
  font-family:var(--font-mono); font-size:11px; color:rgba(236,232,225,.85);
}
.bar{height:4px; background:rgba(255,255,255,.16); border-radius:2px; overflow:hidden; margin-top:6px;}
.bar-fill{height:100%; background:var(--accent); border-radius:2px;}

/* ---------- MAP DETAIL ---------- */
.map-hero{
  position:relative;
  height:180px;
  margin:-26px -28px 24px;
  background:var(--bg-raised) center 35%/cover no-repeat;
  display:flex; align-items:flex-end;
  padding:20px 28px;
  isolation:isolate;
  overflow:hidden;
}
.map-hero::before{
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(15,25,35,.25) 0%, rgba(12,19,26,.55) 60%, var(--bg) 100%);
  z-index:0;
}
.map-hero-content{position:relative; z-index:1; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
.map-hero h2{font-size:32px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.55);}
.map-hero .hero-sub{font-family:var(--font-mono); font-size:12px; color:rgba(236,232,225,.8); letter-spacing:.08em;}

.map-body{display:grid; grid-template-columns:minmax(340px,640px) 1fr; gap:28px; align-items:start;}
.map-body-main{min-width:0;}
.minimap-panel{
  position:sticky;
  top:18px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:4px;
  padding:14px 14px 16px;
}
.minimap-panel .mp-head{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
}
.minimap-panel .mp-label{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; color:var(--text-faint);
}
.minimap-panel .mp-expand{
  background:none; border:1px solid var(--border-strong); color:var(--text-dim);
  width:26px; height:26px; border-radius:3px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.minimap-panel .mp-expand:hover{color:var(--text); background:var(--bg-card-hover); border-color:var(--accent-dim);}
.mp-head-actions{display:flex; align-items:center; gap:6px;}
.minimap-panel .mp-snapshot{
  background:none; border:1px solid var(--border-strong); color:var(--text-dim);
  height:26px; padding:0 10px; border-radius:3px; cursor:pointer;
  display:flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:10px; letter-spacing:.06em;
}
.minimap-panel .mp-snapshot:hover{color:var(--text); background:var(--bg-card-hover); border-color:var(--accent-dim);}
.minimap-panel .mp-snapshot:disabled{opacity:.5; cursor:default; background:none;}
.minimap-panel .mp-frame{
  background:#EDEAE2;
  border-radius:3px;
  overflow:hidden;
  display:block;
  position:relative;
  line-height:0;
}
.minimap-panel img{
  width:100%; display:block;
}
.mp-canvas{
  position:absolute; inset:0;
  width:100%; height:100%;
  touch-action:none;
  cursor:crosshair;
}
.minimap-panel.empty{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:320px; color:var(--text-faint); font-size:13px; text-align:center; gap:10px; padding:24px;
}
.minimap-panel.empty svg{opacity:.4;}
.minimap-panel.empty .mp-empty-sub{font-size:11.5px; max-width:220px; line-height:1.5;}

.lightbox-backdrop{
  position:fixed; inset:0; background:rgba(6,10,14,.86);
  /* Same reasoning as .modal-backdrop: must beat the mobile sidebar
     drawer's z-index (90). */
  display:flex; align-items:center; justify-content:center; z-index:100; padding:24px;
}
.lightbox-stage{display:flex; flex-direction:column; align-items:center; gap:16px; max-width:100%;}
.lightbox-frame{
  position:relative; display:inline-block; line-height:0;
  background:#EDEAE2; border-radius:4px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  max-width:90vw; max-height:70vh;
}
.lightbox-frame img{
  display:block; max-width:90vw; max-height:70vh; border-radius:4px;
}
.lightbox-close{
  position:absolute; top:20px; right:24px; background:var(--bg-raised); border:1px solid var(--border-strong);
  color:var(--text); width:36px; height:36px; border-radius:3px; cursor:pointer; z-index:2;
  display:flex; align-items:center; justify-content:center;
}
.lightbox-close:hover{border-color:var(--accent); color:var(--accent);}
.lightbox-cap{
  font-family:var(--font-display); font-weight:700; letter-spacing:.04em;
  color:var(--text); background:rgba(20,31,41,.85); border:1px solid var(--border);
  padding:7px 16px; border-radius:3px; font-size:14px;
}

/* ---------- DRAWING TOOLBAR ---------- */
.draw-toolbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:12px; padding-top:12px; border-top:1px solid var(--border);
}
.lightbox-frame ~ .draw-toolbar,
.lightbox-stage .draw-toolbar{
  border-top:none; margin-top:0; padding-top:0;
  background:var(--bg-raised); border:1px solid var(--border-strong);
  border-radius:4px; padding:10px 14px;
}
.draw-colors{display:flex; gap:6px;}
.draw-swatch{
  width:22px; height:22px; border-radius:50%; border:2px solid transparent;
  cursor:pointer; padding:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);
}
.draw-swatch.active{border-color:var(--text); box-shadow:0 0 0 2px var(--bg-card), inset 0 0 0 1px rgba(0,0,0,.2);}
.draw-tool-btn{
  background:none; border:1px solid var(--border-strong); color:var(--text-dim);
  width:28px; height:28px; border-radius:3px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex:none;
}
.draw-tool-btn:hover{color:var(--text); background:var(--bg-card-hover);}
.draw-tool-btn.active{color:#0F1923; background:var(--accent); border-color:var(--accent);}
.draw-thickness{display:flex; align-items:center; gap:8px; flex:1 1 110px; min-width:110px;}
.draw-thickness input[type=range]{
  flex:1; accent-color:var(--accent); height:4px; cursor:pointer;
}
.draw-width-readout{
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); width:32px; text-align:right;
}
.draw-toolbar .draw-divider{width:1px; align-self:stretch; background:var(--border-strong);}

/* ---------- AGENT TRAY + MARKERS ---------- */
.agent-tray{margin-top:12px;}
.agent-tray-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  margin-bottom:7px;
}
.agent-tray-label{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; color:var(--text-faint);
}
.agent-tray-label .side-attack{color:var(--accent);}
.agent-tray-label .side-defense{color:var(--defense);}
.agent-side-toggle{display:flex; gap:4px; flex:none;}
.agent-side-btn{
  font-family:var(--font-mono); font-weight:700; font-size:9.5px; letter-spacing:.06em;
  padding:4px 9px; border-radius:3px;
  background:var(--bg-card); border:1px solid var(--border); color:var(--text-faint);
  cursor:pointer;
}
.agent-side-btn:hover{color:var(--text);}
.agent-side-btn.active[data-agentside="attack"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
.agent-side-btn.active[data-agentside="defense"]{background:var(--defense-soft); border-color:var(--defense); color:var(--defense);}
.agent-tray-list{
  display:flex; flex-wrap:wrap; gap:6px;
  max-height:150px; overflow-y:auto;
  padding:8px; background:var(--bg-raised); border:1px solid var(--border); border-radius:4px;
}
.agent-chip-wrap{position:relative; display:inline-flex; flex:none;}
.agent-chip{
  width:36px; height:36px; flex:none; padding:0;
  border-radius:50%; overflow:hidden;
  border:2px solid var(--border-strong);
  background:var(--bg-card);
  cursor:grab;
  touch-action:none;
}
.agent-chip:hover{border-color:var(--accent-dim);}
.agent-chip img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;}
/* Hovering a chip (mouse/trackpad) pops up its ability-icon HUD, built and
   positioned in JS (showAbilityHud) — see the ability-hud rules below. On
   touch there's no hover, so this small corner badge is the tap target

     agentMarkerDiameter), not a fixed px value — so it looks the same

  border-radius:50%;
  overflow:visible;
  cursor:grab;
  pointer-events:auto;
  touch-action:none;

  width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;

// writing every single pointermove into the real strat data. A random
// per-tab id lets each client ignore the echo of its own broadcasts.
var CLIENT_ID = Math.random().toString(36).slice(2) + '_' + Date.now().toString(36);
var LIVE_THROTTLE_MS = 90;

function agentImgSrc(id){
  return 'Agents/' + id.charAt(0).toUpperCase() + id.slice(1) + '.png';
}
function abilityImgSrc(agentId, key){
  return 'Abilities/' + agentId.charAt(0).toUpperCase() + agentId.slice(1) + '/' + key + '.png';

function abilityMeta(agentId, key){

// Small cache so re-rendering a saved diagram doesn't re-fetch the same
// agent icon over and over across strats/maps. Never rejects — a failed
// icon load resolves to null so one bad image can't sink the whole render.
var agentImageCache = {};
function loadAgentImageEl(src){
  if (!agentImageCache[src]){
    agentImageCache[src] = new Promise(function(resolve){
      var im = new Image();
      im.onload = function(){ resolve(im); };
      im.onerror = function(){ resolve(null); };
      im.src = src;
    });

// Redraws a saved diagram (strokes + agent positions, from entry.snapshot)
// onto a <canvas> at whatever size that canvas currently is — used for both
// the small entry-card thumbnail and the big strat viewer. Vector data
// means this always looks crisp, unlike a fixed-resolution PNG would.
function renderSnapshotCanvas(canvas, snapshot, minimapSrc){
  var img = new Image();
  img.onload = function(){
    var w = img.naturalWidth || 1024, h = img.naturalHeight || 1024;
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);

    (snapshot.strokes || []).forEach(function(stroke){
      if (!stroke.points || stroke.points.length < 1) return;
      ctx.globalCompositeOperation = stroke.mode === 'erase' ? 'destination-out' : 'source-over';
      ctx.strokeStyle = stroke.color || DRAW_COLORS[0];
      ctx.lineWidth = Math.max(1, (stroke.width || 5) * (w / DRAW_REF_W));
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      stroke.points.forEach(function(p, i){
        var x = p[0]*w, y = p[1]*h;
        if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      if (stroke.points.length === 1){
        var p0 = stroke.points[0];
        ctx.lineTo(p0[0]*w + 0.01, p0[1]*h + 0.01);
      }
      ctx.stroke();
    });
    ctx.globalCompositeOperation = 'source-over';

    var markers = snapshot.agents || [];
    var abilityMarkers = snapshot.abilities || [];

    // adding ability icons never adds serial latency to the agent-only path.

      Promise.all(markers.map(function(a){ return loadAgentImageEl(agentImgSrc(a.agent)); })),
      Promise.all(abilityMarkers.map(function(a){ return loadAgentImageEl(abilityImgSrc(a.agent, a.key)); }))
    ]).then(function(results){
      var icons = results[0], abIcons = results[1];
      var r = agentMarkerDiameter(w, false) / 2; // same formula as the live on-screen marker

        var icon = icons[i];
        var cx = a.x*w, cy = a.y*h;
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.closePath();
        ctx.clip();
        ctx.fillStyle = '#0F1923';
        ctx.fillRect(cx-r, cy-r, r*2, r*2);
        if (icon) ctx.drawImage(icon, cx-r, cy-r, r*2, r*2);
        ctx.restore();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.lineWidth = Math.max(2, r*0.16);
        ctx.strokeStyle = a.side === 'defense' ? '#0E8F80' : '#E23A49';

      // markers and without a ring (they aren't tied to a side the way
      // agents are, and a border made them harder to tell apart at a glance).
      var ar = abilityMarkerDiameter(w, false) / 2;

        var icon = abIcons[i];

        if (icon) ctx.drawImage(icon, cx-ar, cy-ar, ar*2, ar*2);
        ctx.restore();
      });
    });
  };
  img.src = minimapSrc;
}

var DRAW_COLORS = ['#FF4655', '#3ECF6B', '#4FA3FF', '#FFD447']; // red, green, blue, yellow
var DRAW_REF_W = 1000; // reference width strokes are recorded against

// width, clamped to sane bounds. This is deliberately proportional (not a

  var minD = coarse ? 16 : 11;

/** Wires a canvas overlay + toolbar found inside `root` to mapData.drawing.strokes.
 *  Returns the resize handler so the caller can remove it from window on teardown. */
function setupDrawing(root){
  var frame = root.querySelector('.mp-frame');
  var toolbar = root.querySelector('.draw-toolbar');
  if (!frame || !toolbar) return null;
  var img = frame.querySelector('img');
  if (!img) return null;

  var canvas = document.createElement('canvas');
  canvas.className = 'mp-canvas';
  frame.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  var cssW = 0, cssH = 0;
  var isDrawing = false;
  var current = null;

  function strokes(){
    if (!mapData) return [];
    if (!mapData.drawing) mapData.drawing = {strokes:[]};
    return mapData.drawing.strokes;
  }

  function paintStroke(stroke){
    if (!stroke.points || stroke.points.length < 1) return;
    ctx.globalCompositeOperation = stroke.mode === 'erase' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = stroke.color || DRAW_COLORS[0];
    ctx.lineWidth = Math.max(1, (stroke.width || 5) * (cssW / DRAW_REF_W));
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    stroke.points.forEach(function(p, i){
      var x = p[0] * cssW, y = p[1] * cssH;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    if (stroke.points.length === 1){
      var p0 = stroke.points[0];
      ctx.lineTo(p0[0]*cssW + 0.01, p0[1]*cssH + 0.01);
    }
    ctx.stroke();
  }

  function redraw(){
    ctx.clearRect(0, 0, cssW, cssH);
    strokes().forEach(paintStroke);
    if (current) paintStroke(current);
    // Other players' strokes still in progress (not yet released), so
    // this map's view shows the pen moving live instead of only jumping
    // once the stroke is finished.
    liveIncomingStrokes.forEach(paintStroke);
  }

  function resize(){
    var rect = img.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var dpr = window.devicePixelRatio || 1;
    cssW = rect.width; cssH = rect.height;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
    // agentsLayer doesn't exist yet on the very first resize() call (it's
    // created further below) — harmless no-op until then, and correctly
    // rescales existing markers on every resize/orientation-change after.
    if (agentsLayer) resizeMarkerSizes();
  }

  function round4(n){ return Math.round(n*10000)/10000; }
  function pointFromEvent(e){
    var rect = canvas.getBoundingClientRect();
    var x = rect.width ? (e.clientX - rect.left) / rect.width : 0;
    var y = rect.height ? (e.clientY - rect.top) / rect.height : 0;
    return [round4(Math.min(1, Math.max(0, x))), round4(Math.min(1, Math.max(0, y)))];
  }

  // Drawing edits must not be clobbered by a snapshot that hasn't caught up
  // yet with a change we just made locally (e.g. an in-flight save racing a
  // db round-trip). Rather than guessing at a timeout, keep isEditing true
  // until the save we just triggered has actually round-tripped.
  var pendingDrawSaves = 0;
  function commitDrawChange(){
    isEditing = true;
    scheduleSave();
    pendingDrawSaves++;
    flushSave().then(settle, settle);
    function settle(){
      pendingDrawSaves = Math.max(0, pendingDrawSaves - 1);
      if (pendingDrawSaves === 0 && !isDrawing) isEditing = false;
    }
  }

  var lastLiveStrokeSendAt = 0;
  function throttledPushLiveStroke(){
    var now = Date.now();
    if (now - lastLiveStrokeSendAt < LIVE_THROTTLE_MS) return;
    lastLiveStrokeSendAt = now;
    pushLiveStroke(current);
  }

  function endStroke(){
    if (!isDrawing) return;
    isDrawing = false;
    if (current && current.points.length > 0){
      strokes().push(current);
      commitDrawChange();
    } else if (pendingDrawSaves === 0){
      isEditing = false;
    }
    current = null;
    redraw();
    pushLiveStroke(null); // the real stroke is committed now — clear our live preview
  }

  canvas.addEventListener('pointerdown', function(e){
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    // Defensive re-size: if the minimap image finished loading after our
    // last resize() but before any window-resize/load event caught it,
    // this makes sure we're drawing against correct, current dimensions
    // rather than a stale/zeroed canvas.
    if (!cssW || !cssH) resize();
    if (!cssW || !cssH) return; // still not laid out — nothing sane to draw yet
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch(err){} }
    isDrawing = true;
    isEditing = true;
    current = { color: drawTool.color, width: drawTool.width, mode: drawTool.mode, points: [pointFromEvent(e)] };
    redraw();
  });
  canvas.addEventListener('pointermove', function(e){
    if (!isDrawing || !current) return;
    var pt = pointFromEvent(e);
    var last = current.points[current.points.length - 1];
    if (!last || Math.hypot((pt[0]-last[0])*cssW, (pt[1]-last[1])*cssH) > 1.2){
      current.points.push(pt);
      redraw();
      throttledPushLiveStroke();
    }
  });
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('lostpointercapture', endStroke);
  // Safety net: if the pointer is released outside the canvas and capture
  // didn't take for some reason, the stroke must still be committed —
  // otherwise it renders correctly until the next redraw, then vanishes.
  var windowPointerUp = function(){ if (isDrawing) endStroke(); };
  window.addEventListener('pointerup', windowPointerUp);
  window.addEventListener('blur', windowPointerUp);

  toolbar.querySelectorAll('.draw-swatch').forEach(function(btn){
    btn.addEventListener('click', function(){
      drawTool.color = btn.getAttribute('data-color');
      drawTool.mode = 'draw';
      syncToolbarUI();
    });
  });
  var eraseBtn = toolbar.querySelector('[data-tool="erase"]');
  eraseBtn.addEventListener('click', function(){
    drawTool.mode = 'erase';
    syncToolbarUI();
  });
  toolbar.querySelector('[data-tool="undo"]').addEventListener('click', function(){
    strokes().pop();
    commitDrawChange();
    redraw();
  });
  toolbar.querySelector('[data-tool="clear"]').addEventListener('click', function(){
    if (mapData && mapData.drawing) mapData.drawing.strokes = [];
    if (mapData) mapData.agents = [];
    if (mapData) mapData.abilities = [];
    commitDrawChange();
    redraw();
    refreshAllAgentViews();
  });
  var slider = toolbar.querySelector('.draw-width-slider');
  slider.addEventListener('input', function(){
    drawTool.width = +slider.value;
    toolbar.querySelector('.draw-width-readout').textContent = drawTool.width + 'px';
  });

  function syncToolbarUI(){
    toolbar.querySelectorAll('.draw-swatch').forEach(function(b){
      b.classList.toggle('active', drawTool.mode==='draw' && b.getAttribute('data-color')===drawTool.color);
    });
    eraseBtn.classList.toggle('active', drawTool.mode==='erase');
  }

  window.addEventListener('resize', resize);
  // The minimap image can still be loading (real network images especially)
  // when this panel is first built, so the very first resize() call above
  // may find a 0x0 rect and bail — leaving the canvas at its default pixel
  // size until something else happens to resize the window. Re-run resize()
  // once the image's real dimensions are actually available, so the canvas
  // gets sized correctly right away instead of only on the next accidental
  // window resize (which is also when old, wrongly-scaled strokes would
  // suddenly "pop back" at the correct size, looking like new strokes wipe
  // out old ones).
  img.addEventListener('load', resize);
  resize();

  /* ---------------- agent markers ---------------- */
  // Positions are stored as 0..1 fractions of the frame, same convention as
  // stroke points, so they stay correctly placed at any frame size without
  // needing their own resize handling (plain CSS percentages do that).

  var agentsLayer = document.createElement('div');
  agentsLayer.className = 'mp-agents-layer';
  frame.appendChild(agentsLayer);
  var isCoarsePointer = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);

  function agentsList(){
    if (!mapData) return [];
    if (!Array.isArray(mapData.agents)) mapData.agents = [];
    return mapData.agents;
  }
  function abilitiesList(){
    if (!mapData) return [];
    if (!Array.isArray(mapData.abilities)) mapData.abilities = [];
    return mapData.abilities;
  }
  function agentMeta(id){
    for (var i=0;i<AGENTS.length;i++){ if (AGENTS[i].id===id) return AGENTS[i]; }
    return {id:id, name:id};
  }
  function clampPct(n){ return Math.min(1, Math.max(0, n)); }

  function resizeMarkerSizes(){
    var d = agentMarkerDiameter(cssW, isCoarsePointer) + 'px';
    var ad = abilityMarkerDiameter(cssW, isCoarsePointer) + 'px';
    Array.prototype.forEach.call(agentsLayer.children, function(el){
      var size = el.classList.contains('ability-marker') ? ad : d;
      el.style.width = size;
      el.style.height = size;
    });
  }

  function renderMarkers(){
    agentsLayer.innerHTML = '';
    var d = agentMarkerDiameter(cssW, isCoarsePointer) + 'px';
    agentsList().forEach(function(a){
      var meta = agentMeta(a.agent);
      var el = document.createElement('div');
      el.className = 'agent-marker side-' + a.side;
      el.style.left = (a.x*100) + '%';
      el.style.top = (a.y*100) + '%';
      el.style.width = d;
      el.style.height = d;
      el.innerHTML =
        '<img src="' + agentImgSrc(a.agent) + '" alt="' + esc(meta.name) + '" draggable="false">' +
        '<button type="button" class="agent-marker-remove" aria-label="Remove ' + esc(meta.name) + '" title="Remove ' + esc(meta.name) + '">' +
          '<svg width="9" height="9" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
        '</button>';
      agentsLayer.appendChild(el);
      wireMarkerDrag(el, a.id);
    });
    var ad = abilityMarkerDiameter(cssW, isCoarsePointer) + 'px';
    abilitiesList().forEach(function(a){
      var meta = abilityMeta(a.agent, a.key);
      var el = document.createElement('div');
      el.className = 'ability-marker';
      el.style.left = (a.x*100) + '%';
      el.style.top = (a.y*100) + '%';
      el.style.width = ad;
      el.style.height = ad;
      el.innerHTML =
        '<img src="' + abilityImgSrc(a.agent, a.key) + '" alt="' + esc(meta.name) + '" draggable="false">' +
        '<button type="button" class="ability-marker-remove" aria-label="Remove ' + esc(meta.name) + '" title="Remove ' + esc(meta.name) + '">' +
          '<svg width="8" height="8" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
        '</button>';
      agentsLayer.appendChild(el);
      wireAbilityMarkerDrag(el, a.id);
    });
    renderLiveAgentGhosts(); // agentsLayer.innerHTML was just wiped — put them back
    renderLiveAbilityGhosts();
  }

  // Other players' agent markers still mid-drag (not yet released). Drawn
  // as a separate, non-interactive layer on top of the real markers so a
  // real re-render (renderMarkers) never has to know about them — it just
  // calls this again after it rebuilds.
  function renderLiveAgentGhosts(){
    Array.prototype.slice.call(agentsLayer.querySelectorAll('.agent-live-ghost')).forEach(function(g){ g.remove(); });
    if (!liveIncomingAgentGhosts.length) return;
    var d = agentMarkerDiameter(cssW, isCoarsePointer) + 'px';
    liveIncomingAgentGhosts.forEach(function(g){
      var rec = agentsList().filter(function(a){ return a.id===g.agentId; })[0];
      if (!rec) return; // marker not created on our side yet — skip rather than guess its side/art
      var meta = agentMeta(rec.agent);
      var el = document.createElement('div');
      el.className = 'agent-marker agent-live-ghost side-' + rec.side;
      el.style.left = (g.x*100) + '%';
      el.style.top = (g.y*100) + '%';
      el.style.width = d;
      el.style.height = d;
      el.innerHTML = '<img src="' + agentImgSrc(rec.agent) + '" alt="' + esc(meta.name) + '" draggable="false">';
      agentsLayer.appendChild(el);
    });
  }

  function removeAgentById(id){
    var list = agentsList();
    var idx = -1;
    for (var i=0;i<list.length;i++){ if (list[i].id===id){ idx = i; break; } }
    if (idx > -1){ list.splice(idx,1); commitDrawChange(); refreshAllAgentViews(); return true; }
    return false;
  }

  // Other players' ability markers still mid-drag — same idea as
  // renderLiveAgentGhosts, kept as its own non-interactive layer so a real
  // renderMarkers() rebuild doesn't need to know about it.
  function renderLiveAbilityGhosts(){
    Array.prototype.slice.call(agentsLayer.querySelectorAll('.ability-live-ghost')).forEach(function(g){ g.remove(); });
    if (!liveIncomingAbilityGhosts.length) return;
    var d = abilityMarkerDiameter(cssW, isCoarsePointer) + 'px';
    liveIncomingAbilityGhosts.forEach(function(g){
      var rec = abilitiesList().filter(function(a){ return a.id===g.abilityId; })[0];
      if (!rec) return; // marker not created on our side yet — skip rather than guess its art
      var meta = abilityMeta(rec.agent, rec.key);
      var el = document.createElement('div');
      el.className = 'ability-marker ability-live-ghost';
      el.style.left = (g.x*100) + '%';
      el.style.top = (g.y*100) + '%';
      el.style.width = d;
      el.style.height = d;
      el.innerHTML = '<img src="' + abilityImgSrc(rec.agent, rec.key) + '" alt="' + esc(meta.name) + '" draggable="false">';
      agentsLayer.appendChild(el);
    });
  }

  function removeAbilityById(id){
    var list = abilitiesList();
    var idx = -1;
    for (var i=0;i<list.length;i++){ if (list[i].id===id){ idx = i; break; } }
    if (idx > -1){ list.splice(idx,1); commitDrawChange(); refreshAllAgentViews(); return true; }
    return false;
  }

  function wireAbilityMarkerDrag(el, id){
    var dragging = false;
    var lastAbilityLiveSendAt = 0;
    function throttledPushLiveAbilityDrag(pos){
      var now = Date.now();
      if (now - lastAbilityLiveSendAt < LIVE_THROTTLE_MS) return;
      lastAbilityLiveSendAt = now;
      pushLiveAbilityDrag(id, pos);
    }
    function move(e){
      var rect = frame.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      var overF = overFrame(e);
      el.classList.toggle('will-delete', !overF);
      var x = clampPct((e.clientX - rect.left) / rect.width);
      var y = clampPct((e.clientY - rect.top) / rect.height);
      var rec = abilitiesList().filter(function(a){ return a.id===id; })[0];
      if (!rec) return;
      rec.x = round4(x); rec.y = round4(y);
      el.style.left = (x*100) + '%';
      el.style.top = (y*100) + '%';
      throttledPushLiveAbilityDrag(overF ? {x: rec.x, y: rec.y} : null);
    }
    el.addEventListener('pointerdown', function(e){
      if (e.target.closest('.ability-marker-remove')) return;
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      dragging = true;
      try { el.setPointerCapture(e.pointerId); } catch(err){}
      el.classList.add('dragging');
    });
    el.addEventListener('pointermove', function(e){ if (dragging) move(e); });
    function finish(e, allowDelete){
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging', 'will-delete');
      pushLiveAbilityDrag(id, null); // the real position is committed now — clear the live ghost
      if (allowDelete && e && typeof e.clientX === 'number' && !overFrame(e)){
        removeAbilityById(id);
        return;
      }
      commitDrawChange();
      refreshAllAgentViews();
    }
    el.addEventListener('pointerup', function(e){ finish(e, true); });
    el.addEventListener('pointercancel', function(e){ finish(e, false); });
    el.querySelector('.ability-marker-remove').addEventListener('click', function(e){
      e.stopPropagation();
      removeAbilityById(id);
    });
  }

  function wireMarkerDrag(el, id){
    var dragging = false;
    var lastAgentLiveSendAt = 0;
    function throttledPushLiveAgentDrag(pos){
      var now = Date.now();
      if (now - lastAgentLiveSendAt < LIVE_THROTTLE_MS) return;
      lastAgentLiveSendAt = now;
      pushLiveAgentDrag(id, pos);
    }
    function move(e){
      var rect = frame.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      // Dragged clear of the map — mark it for deletion (like dragging an
      // icon off the dock) but keep tracking the pointer so letting go
      // back over the map cancels the delete.
      var overF = overFrame(e);
      el.classList.toggle('will-delete', !overF);
      var x = clampPct((e.clientX - rect.left) / rect.width);
      var y = clampPct((e.clientY - rect.top) / rect.height);
      var rec = agentsList().filter(function(a){ return a.id===id; })[0];
      if (!rec) return;
      rec.x = round4(x); rec.y = round4(y);
      el.style.left = (x*100) + '%';
      el.style.top = (y*100) + '%';
      // Only broadcast a live ghost while it's actually over the map —
      // once it's flying off to be deleted there's nothing useful to show.
      throttledPushLiveAgentDrag(overF ? {x: rec.x, y: rec.y} : null);
    }
    el.addEventListener('pointerdown', function(e){
      if (e.target.closest('.agent-marker-remove')) return;
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      dragging = true;
      try { el.setPointerCapture(e.pointerId); } catch(err){}
      el.classList.add('dragging');
    });
    el.addEventListener('pointermove', function(e){ if (dragging) move(e); });
    // Releasing outside the map deletes the marker, like throwing it away;
    // pointercancel (an interrupted gesture, not a deliberate drop) never
    // deletes — it just leaves the marker at its last position.
    function finish(e, allowDelete){
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging', 'will-delete');
      pushLiveAgentDrag(id, null); // the real position is committed now — clear the live ghost
      if (allowDelete && e && typeof e.clientX === 'number' && !overFrame(e)){
        removeAgentById(id);
        return;
      }
      commitDrawChange();
      refreshAllAgentViews();
    }
    el.addEventListener('pointerup', function(e){ finish(e, true); });
    el.addEventListener('pointercancel', function(e){ finish(e, false); });
    el.querySelector('.agent-marker-remove').addEventListener('click', function(e){
      e.stopPropagation();
      removeAgentById(id);
    });
  }

  renderMarkers();
  agentsRenderers.push(renderMarkers);

  // Repaint both the live-preview stroke overlay and the live agent-drag
  // ghosts for this view — called whenever a new live update arrives from
  // another client (applyIncomingLive, fed by startCloudSync's onSnapshot).
  function refreshLiveOverlay(){
    redraw();
    renderLiveAgentGhosts();
    renderLiveAbilityGhosts();
  }
  liveDrawRedraws.push(refreshLiveOverlay);

  // Dragging an agent (or an ability, from its hover HUD) in from the tray.
  // Built on Pointer Events (not the HTML5 Drag and Drop API) so it works
  // the same on touch as with a mouse. dragKind tells trayEnd which list to
  // push the new marker onto once it's released over the map.
  var tray = root.querySelector('.agent-tray');
  var ghostEl = null;
  var trayPointerId = null;
  var dragKind = null;       // 'agent' | 'ability'
  var dragAbilityKey = null; // set only when dragKind === 'ability'

  function removeGhost(){
    if (ghostEl && ghostEl.parentNode) ghostEl.parentNode.removeChild(ghostEl);
    ghostEl = null;
  }
  function overFrame(e){
    var rect = frame.getBoundingClientRect();
    return rect.width>0 && e.clientX>=rect.left && e.clientX<=rect.right && e.clientY>=rect.top && e.clientY<=rect.bottom;
  }
  function trayMove(e){
    if (trayPointerId === null || e.pointerId !== trayPointerId) return;
    if (ghostEl){ ghostEl.style.left = e.clientX+'px'; ghostEl.style.top = e.clientY+'px'; }
    frame.classList.toggle('agent-drop-target', overFrame(e));
  }
  function trayEnd(e){
    if (trayPointerId === null || e.pointerId !== trayPointerId) return;
    trayPointerId = null;
    frame.classList.remove('agent-drop-target');
    if (ghostEl && overFrame(e)){
      var rect = frame.getBoundingClientRect();
      var x = clampPct((e.clientX - rect.left) / rect.width);
      var y = clampPct((e.clientY - rect.top) / rect.height);
      if (dragKind === 'ability'){
        abilitiesList().push({id: genId('ability'), agent: ghostEl.getAttribute('data-agent'), key: dragAbilityKey, x: round4(x), y: round4(y)});
      } else {
        agentsList().push({id: genId('agent'), agent: ghostEl.getAttribute('data-agent'), side: selectedAgentSide, x: round4(x), y: round4(y)});
      }
      commitDrawChange();
      refreshAllAgentViews();
    }
    removeGhost();
    dragKind = null;
    dragAbilityKey = null;
    window.removeEventListener('pointermove', trayMove);
    window.removeEventListener('pointerup', trayEnd);
    window.removeEventListener('pointercancel', trayEnd);
  }

  // ---- hover-to-reveal ability HUD ----
  // One shared floating popover per mounted view (panel / lightbox each get
  // their own), repositioned and repopulated for whichever chip triggered
  // it. Desktop: mouseenter/mouseleave on the chip itself. Touch: hover
  // doesn't exist, so a small corner badge on the chip (see CSS) toggles it
  // instead, without interfering with the chip's own drag-to-place gesture.
  var abilityHud = null;
  var hudHideTimer = null;
  var hudAgentId = null;
  function ensureAbilityHud(){
    if (abilityHud) return abilityHud;
    abilityHud = document.createElement('div');
    abilityHud.className = 'ability-hud';
    document.body.appendChild(abilityHud);
    abilityHud.addEventListener('mouseenter', function(){ clearTimeout(hudHideTimer); });
    abilityHud.addEventListener('mouseleave', function(){ hideAbilityHudSoon(); });
    return abilityHud;
  }
  function positionAbilityHud(chip){
    var hud = abilityHud;
    var r = chip.getBoundingClientRect();
    var hb = hud.getBoundingClientRect();
    var cx = r.left + r.width/2;
    var top = r.top - hb.height - 4;
    if (top < 4) top = r.bottom + 4;
    var left = Math.min(Math.max(8, cx - hb.width/2), window.innerWidth - hb.width - 8);
    hud.style.left = Math.max(4, left) + 'px';
    hud.style.top = top + 'px';
  }
  function wireAbilityHudItems(hud){
    Array.prototype.forEach.call(hud.querySelectorAll('.ability-hud-item'), function(item){
      item.addEventListener('pointerdown', function(e){
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        clearTimeout(hudHideTimer);
        trayPointerId = e.pointerId;
        dragKind = 'ability';
        var agentId = item.getAttribute('data-agent');
        dragAbilityKey = item.getAttribute('data-key');
        ghostEl = document.createElement('div');
        ghostEl.className = 'ability-drag-ghost';
        ghostEl.setAttribute('data-agent', agentId);
        ghostEl.innerHTML = '<img src="' + abilityImgSrc(agentId, dragAbilityKey) + '" alt="">';
        var gd = abilityMarkerDiameter(cssW, isCoarsePointer);
        ghostEl.style.width = gd + 'px';
        ghostEl.style.height = gd + 'px';
        ghostEl.style.marginLeft = (-gd/2) + 'px';
        ghostEl.style.marginTop = (-gd/2) + 'px';
        ghostEl.style.left = e.clientX+'px';
        ghostEl.style.top = e.clientY+'px';
        document.body.appendChild(ghostEl);
        window.addEventListener('pointermove', trayMove);
        window.addEventListener('pointerup', trayEnd);
        window.addEventListener('pointercancel', trayEnd);
        hud.classList.remove('open');
        hudAgentId = null;
      });
    });
  }
  function showAbilityHud(chip, agentId){
    var abilities = AGENT_ABILITIES[agentId] || [];
    if (!abilities.length) return;
    clearTimeout(hudHideTimer);
    var hud = ensureAbilityHud();
    hudAgentId = agentId;
    hud.innerHTML = abilities.map(function(ab){
      return '<button type="button" class="ability-hud-item" data-agent="' + agentId + '" data-key="' + ab.key + '" title="' + esc(ab.name) + '" aria-label="Drag ' + esc(ab.name) + ' onto the map">' +
        '<img src="' + abilityImgSrc(agentId, ab.key) + '" alt="" draggable="false">' +
      '</button>';
    }).join('');
    hud.classList.add('open');
    positionAbilityHud(chip);
    wireAbilityHudItems(hud);
  }
  function hideAbilityHudSoon(){
    clearTimeout(hudHideTimer);
    hudHideTimer = setTimeout(function(){
      if (abilityHud) abilityHud.classList.remove('open');
      hudAgentId = null;
    }, 500);
  }

  if (tray){
    Array.prototype.forEach.call(tray.querySelectorAll('.agent-chip'), function(chip){
      var agentId = chip.getAttribute('data-agent');
      if (!isCoarsePointer){
        chip.addEventListener('mouseenter', function(){ showAbilityHud(chip, agentId); });
        chip.addEventListener('mouseleave', function(){ hideAbilityHudSoon(); });
      }
      chip.addEventListener('pointerdown', function(e){
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        trayPointerId = e.pointerId;
        dragKind = 'agent';
        ghostEl = document.createElement('div');
        ghostEl.className = 'agent-drag-ghost side-' + selectedAgentSide;
        ghostEl.setAttribute('data-agent', agentId);
        ghostEl.innerHTML = '<img src="' + agentImgSrc(agentId) + '" alt="">';
        var gd = agentMarkerDiameter(cssW, isCoarsePointer);
        ghostEl.style.width = gd + 'px';
        ghostEl.style.height = gd + 'px';
        ghostEl.style.marginLeft = (-gd/2) + 'px';
        ghostEl.style.marginTop = (-gd/2) + 'px';
        ghostEl.style.left = e.clientX+'px';
        ghostEl.style.top = e.clientY+'px';
        document.body.appendChild(ghostEl);
        window.addEventListener('pointermove', trayMove);
        window.addEventListener('pointerup', trayEnd);
        window.addEventListener('pointercancel', trayEnd);
      });
    });
    // Touch: the corner badge (hidden on fine-pointer devices via CSS)
    // toggles the same HUD that hover shows on desktop.
    Array.prototype.forEach.call(tray.querySelectorAll('.agent-chip-abilities-toggle'), function(toggle){
      var agentId = toggle.getAttribute('data-agent');
      var chip = toggle.parentNode.querySelector('.agent-chip');
      toggle.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      toggle.addEventListener('click', function(e){
        e.stopPropagation();
        if (abilityHud && abilityHud.classList.contains('open') && hudAgentId === agentId){
          abilityHud.classList.remove('open');
          hudAgentId = null;
        } else {
          showAbilityHud(chip, agentId);
        }
      });
    });
    Array.prototype.forEach.call(tray.querySelectorAll('.agent-side-btn'), function(btn){
      btn.addEventListener('click', function(){
        selectedAgentSide = btn.getAttribute('data-agentside');
        Array.prototype.forEach.call(tray.querySelectorAll('.agent-side-btn'), function(b){
          b.classList.toggle('active', b === btn);
        });
      });
    });
  }

  /* ---------------- save current view as a diagram ---------------- */
  // Captures the map's CURRENT strokes + agent positions as plain vector
  // data (a deep-cloned snapshot), not a rendered picture. Unlike a PNG
  // this is a few hundred bytes regardless of complexity, so it syncs to
  // shared players exactly like the rest of the strat book instead of
  // being too big for Firestore — and renderSnapshotCanvas() redraws it
  // crisp at whatever size it's shown, phone or desktop.
  function captureSnapshot(){
    return {
      strokes: JSON.parse(JSON.stringify(strokes())),
      agents: JSON.parse(JSON.stringify(agentsList())),
      abilities: JSON.parse(JSON.stringify(abilitiesList()))
    };
  }

  var snapshotBtn = root.querySelector('#mpSnapshotBtn');
  if (snapshotBtn){
    snapshotBtn.addEventListener('click', function(){
      if (snapshotBtn.disabled) return;
      showAttachSnapshotModal(captureSnapshot());
    });
  }

  return function teardown(){
    window.removeEventListener('resize', resize);
    img.removeEventListener('load', resize);
    window.removeEventListener('pointerup', windowPointerUp);
    window.removeEventListener('blur', windowPointerUp);
    window.removeEventListener('pointermove', trayMove);
    window.removeEventListener('pointerup', trayEnd);
    window.removeEventListener('pointercancel', trayEnd);
    removeGhost();
    clearTimeout(hudHideTimer);
    if (abilityHud && abilityHud.parentNode) abilityHud.parentNode.removeChild(abilityHud);
    abilityHud = null;
    var ri = agentsRenderers.indexOf(renderMarkers);
    if (ri > -1) agentsRenderers.splice(ri, 1);
    var li = liveDrawRedraws.indexOf(refreshLiveOverlay);
    if (li > -1) liveDrawRedraws.splice(li, 1);
  };
}

/* ---------------- helpers ---------------- */

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function genId(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
// `image` is a legacy rendered-PNG snapshot (pre-sharing feature) — kept
// readable for old data but never created anymore and never synced to
// Firestore (a rendered image is far too big). `snapshot` is its
// replacement: the raw drawing strokes + agent positions at the moment the
// coach saved them, tiny vector data that syncs fine and re-renders crisp
// at any size via renderSnapshotCanvas().
function makeEntry(){ return {id: genId('entry'), title:'', notes:'', image:null, snapshot:null}; }
function entryHasContent(e){ return !!((e.title && e.title.trim()) || (e.notes && e.notes.trim()) || e.image || e.snapshot); }

function emptyMapData(mapId){
  var categories = {};
  // Every category starts empty — the coach adds exactly as many strat
  // slots as they actually want via the "+ Add" card in each category.
  CATEGORIES.forEach(function(c){ categories[c.key] = []; });
  return {mapId:mapId, categories:categories, drawing:{strokes:[]}, agents:[], abilities:[], updatedAt:null};
}

function normalizeMapData(mapId, raw){
  var base = emptyMapData(mapId);
  if (!raw) return base;
  CATEGORIES.forEach(function(c){
    var arr = raw.categories && raw.categories[c.key];
    // A brand-new map (no saved array for this category yet) keeps the
    // default seeded slots from emptyMapData. A saved array — even an
    // empty one, meaning the coach deleted every slot on purpose — is
    // used exactly as-is, at whatever length it happens to be, since
    // slots can now be added or removed freely.
    if (Array.isArray(arr)){
      base.categories[c.key] = arr.map(function(e){
        return {
          id: (e && e.id) || genId('entry'),
          title: (e && e.title) || '',
          notes: (e && e.notes) || '',
          image: (e && typeof e.image === 'string' && e.image) ? e.image : null,
          snapshot: (e && e.snapshot && Array.isArray(e.snapshot.strokes) && Array.isArray(e.snapshot.agents)) ?
            { strokes: e.snapshot.strokes, agents: e.snapshot.agents, abilities: Array.isArray(e.snapshot.abilities) ? e.snapshot.abilities : [] } : null
        };
      });
    }
  });
  if (raw.drawing && Array.isArray(raw.drawing.strokes)) base.drawing = {strokes: raw.drawing.strokes};
  if (Array.isArray(raw.agents)){
    base.agents = raw.agents.map(function(a){
      return {
        id: (a && a.id) || genId('agent'),
        agent: (a && a.agent) || AGENTS[0].id,
        side: (a && a.side === 'defense') ? 'defense' : 'attack',
        x: (a && typeof a.x === 'number') ? Math.min(1, Math.max(0, a.x)) : 0.5,
        y: (a && typeof a.y === 'number') ? Math.min(1, Math.max(0, a.y)) : 0.5
      };
    });
  }
  if (Array.isArray(raw.abilities)){
    base.abilities = raw.abilities.map(function(a){
      return {
        id: (a && a.id) || genId('ability'),
        agent: (a && a.agent) || AGENTS[0].id,
        key: (a && a.key) || 'Q',
        x: (a && typeof a.x === 'number') ? Math.min(1, Math.max(0, a.x)) : 0.5,
        y: (a && typeof a.y === 'number') ? Math.min(1, Math.max(0, a.y)) : 0.5
      };
    });
  }
  base.updatedAt = raw.updatedAt || null;
  return base;
}

function countFilled(mapData){
  if (!mapData) return 0;
  var n = 0;
  CATEGORIES.forEach(function(c){
    mapData.categories[c.key].forEach(function(e){
      if (entryHasContent(e)) n++;
    });
  });
  return n;
}

function totalSlots(mapData){
  if (!mapData) return 0;
  var n = 0;
  CATEGORIES.forEach(function(c){ n += mapData.categories[c.key].length; });
  return n;
}

function relTime(ts){
  if (!ts) return null;
  var d = Date.now() - ts;
  var m = Math.round(d/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  var h = Math.round(m/60);
  if (h < 24) return h + 'h ago';
  var days = Math.round(h/24);
  return days + 'd ago';
}

/* ---------------- storage backends ---------------- */

function makeLocalBackend(){
  var LS_KEY = 'antiStratVault_v1';
  function load(){
    try { var raw = JSON.parse(localStorage.getItem(LS_KEY)); return raw || {teams:{}, maps:{}}; }
    catch(e){ return {teams:{}, maps:{}}; }
  }
  function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
  var state = load();
  var teamListeners = [];
  var mapListeners = {};

  function teamList(){
    return Object.keys(state.teams).map(function(id){ return Object.assign({id:id}, state.teams[id]); })
      .sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  }
  function notifyTeams(){ teamListeners.forEach(function(cb){ cb(teamList()); }); }
  function notifyMap(teamId, mapId){
    var key = teamId+'|'+mapId;
    var data = state.maps[key] || null;
    (mapListeners[key]||[]).forEach(function(cb){ cb(data); });
  }

  return {
    kind:'local',
    subscribeTeams: function(cb){
      teamListeners.push(cb);
      cb(teamList());
      return function(){ teamListeners = teamListeners.filter(function(x){ return x!==cb; }); };
    },
    addTeam: function(name){
      var id = 'team_' + Math.random().toString(36).slice(2,10);
      state.teams[id] = {name:name, createdAt: Date.now()};
      persist(); notifyTeams();
      return Promise.resolve(id);
    },
    renameTeam: function(id, name){
      if (state.teams[id]){ state.teams[id].name = name; persist(); notifyTeams(); }
      return Promise.resolve();
    },
    deleteTeam: function(id){
      delete state.teams[id];
      Object.keys(state.maps).forEach(function(k){ if (k.indexOf(id+'|')===0) delete state.maps[k]; });
      persist(); notifyTeams();
      return Promise.resolve();
    },
    setShareCode: function(id, code){
      if (state.teams[id]){ state.teams[id].shareCode = code || null; persist(); notifyTeams(); }
      return Promise.resolve();
    },
    getTeamMapsSnapshot: function(teamId){
      var out = {};
      MAPS.forEach(function(m){
        var key = teamId + '|' + m.id;
        if (state.maps[key]) out[m.id] = state.maps[key];
      });
      return out;
    },
    getRawMap: function(teamId, mapId){
      return state.maps[teamId + '|' + mapId] || null;
    },
    addTeamWithData: function(name, shareCode, maps){
      var id = 'team_' + Math.random().toString(36).slice(2,10);
      state.teams[id] = {name: name, createdAt: Date.now(), shareCode: shareCode || null};
      Object.keys(maps || {}).forEach(function(mapId){
        state.maps[id + '|' + mapId] = maps[mapId];
      });
      persist(); notifyTeams();
      return Promise.resolve(id);
    },
    subscribeMap: function(teamId, mapId, cb){
      var key = teamId+'|'+mapId;
      mapListeners[key] = mapListeners[key] || [];
      mapListeners[key].push(cb);
      cb(state.maps[key] || null);
      return function(){ mapListeners[key] = (mapListeners[key]||[]).filter(function(x){ return x!==cb; }); };
    },
    saveMap: function(teamId, mapId, data){
      var key = teamId+'|'+mapId;
      state.maps[key] = data;
      persist(); notifyMap(teamId, mapId);
      return Promise.resolve();
    },
    exportSnapshot: function(){
      return state;
    },
    importSnapshot: function(data){
      var next = { teams:{}, maps:{} };
      if (data && typeof data === 'object'){
        if (data.teams && typeof data.teams === 'object') next.teams = data.teams;
        if (data.maps && typeof data.maps === 'object') next.maps = data.maps;
      }
      var affectedKeys = Object.keys(mapListeners);
      state = next;
      persist();
      notifyTeams();
      affectedKeys.forEach(function(key){
        var parts = key.split('|');
        notifyMap(parts[0], parts[1]);
      });
      return teamList().length;
    }
  };
}

/* ---------------- cloud sharing ---------------- */
// Sharing a team's strat book copies its data into one Firestore document
// (keyed by a short share code) that any browser with the code can read and
// write directly — there's no login, so a share code works like a house
// key: anyone who has it can edit or replace strats in that book. This is
// deliberately simple last-write-wins syncing (no per-field merge/CRDT), to
// match "share a link, anyone with it can edit live" rather than building
// real operational-transform collaboration.
//
// Attached strat photos ("Save as Image") are NOT included in what syncs —
// a Firestore document is capped at 1MB and a handful of embedded PNGs
// would blow past that fast. Text notes, live drawing strokes, and agent
// placements all sync (they're compact vector/text data); photos stay
// local to whichever browser attached them. cloneMapForCloud() strips them
// on the way out, and mergeIncomingPreservingImages() puts back whatever
// image a local copy already had on the way in, so a shared team's owner
// doesn't lose their own attached photos when a remote update arrives.

var cloudEnabled = false;
var db = null;
(function initCloud(){
  try {
    var cfg = window.__FIREBASE_CONFIG__;
    if (cfg && cfg.apiKey && cfg.projectId && window.firebase){
      firebase.initializeApp(cfg);
      db = firebase.firestore();
      cloudEnabled = true;
    }
  } catch(e){ cloudEnabled = false; db = null; }
})();

var SHARE_CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L — easy to read aloud/type
function genShareCode(){
  var out = '';
  for (var i=0;i<7;i++) out += SHARE_CODE_CHARS[Math.floor(Math.random()*SHARE_CODE_CHARS.length)];
  return out;
}
function shareUrlFor(code){
  return location.origin + location.pathname + '?join=' + code;
}

// Firestore rejects arrays-of-arrays ("nested arrays are not supported"),
// but a stroke's points are stored locally as [[x,y], [x,y], ...] — exactly
// that shape. These convert points to/from a Firestore-safe {x,y} object
// form at the cloud boundary; everything else in the app keeps using plain
// [x,y] pairs, unaware any of this is happening.
function pointsToCloud(points){
  return (points || []).map(function(p){ return {x: p[0], y: p[1]}; });
}
function pointsFromCloud(points){
  return (points || []).map(function(p){
    return Array.isArray(p) ? p : [p.x, p.y];
  });
}
function strokesToCloud(strokes){
  return (strokes || []).map(function(s){
    var s2 = Object.assign({}, s);
    s2.points = pointsToCloud(s.points);
    return s2;
  });
}
function strokesFromCloud(strokes){
  return (strokes || []).map(function(s){
    var s2 = Object.assign({}, s);
    s2.points = pointsFromCloud(s.points);
    return s2;
  });
}
// A strat's saved diagram (entry.snapshot) has the exact same nested-array
// shape problem as the live drawing (entry.snapshot.strokes[].points), so
// every entry across every category needs the same points conversion,
// each direction, right alongside the live mapData.drawing.strokes.
function cloneMapForCloud(mapPayload){
  var clone = JSON.parse(JSON.stringify(mapPayload));
  Object.keys(clone.categories || {}).forEach(function(catKey){
    (clone.categories[catKey] || []).forEach(function(e){
      e.image = null; // legacy raster photo never syncs (too big for Firestore)
      if (e.snapshot && Array.isArray(e.snapshot.strokes)){
        e.snapshot = Object.assign({}, e.snapshot, { strokes: strokesToCloud(e.snapshot.strokes) });
      }
    });
  });
  if (clone.drawing && Array.isArray(clone.drawing.strokes)){
    clone.drawing.strokes = strokesToCloud(clone.drawing.strokes);
  }
  return clone;
}
function cloneMapFromCloud(mapPayload){
  var clone = JSON.parse(JSON.stringify(mapPayload));
  Object.keys(clone.categories || {}).forEach(function(catKey){
    (clone.categories[catKey] || []).forEach(function(e){
      if (e.snapshot && Array.isArray(e.snapshot.strokes)){
        e.snapshot = Object.assign({}, e.snapshot, { strokes: strokesFromCloud(e.snapshot.strokes) });
      }
    });
  });
  if (clone.drawing && Array.isArray(clone.drawing.strokes)){
    clone.drawing.strokes = strokesFromCloud(clone.drawing.strokes);
  }
  return clone;
}
function mergeIncomingPreservingImages(existingRaw, incoming){
  var merged = JSON.parse(JSON.stringify(incoming));
  if (!existingRaw) return merged;
  Object.keys(merged.categories || {}).forEach(function(catKey){
    var existingEntries = (existingRaw.categories && existingRaw.categories[catKey]) || [];
    (merged.categories[catKey] || []).forEach(function(e){
      if (!e.image){
        var match = existingEntries.find(function(x){ return x.id === e.id; });
        if (match && match.image) e.image = match.image;
      }
    });
  });
  return merged;
}

var cloudSubs = {};          // teamId -> unsubscribe fn
var cloudLastApplied = {};   // teamId+'|'+mapId -> updatedAt already applied, to ignore our own echo

function startCloudSync(teamId, code){
  stopCloudSync(teamId);
  if (!cloudEnabled || !code) return;
  cloudSubs[teamId] = db.collection('sharedTeams').doc(code).onSnapshot(function(snap){
    if (!snap.exists) return;
    var data = snap.data() || {};
    var maps = data.maps || {};
    Object.keys(maps).forEach(function(mapId){
      var incoming = maps[mapId];
      if (!incoming) return;
      var key = teamId + '|' + mapId;
      var incomingTs = incoming.updatedAt || 0;
      if (cloudLastApplied[key] && incomingTs <= cloudLastApplied[key]) return;
      cloudLastApplied[key] = incomingTs;
      var existingRaw = backend.getRawMap(teamId, mapId);
      backend.saveMap(teamId, mapId, mergeIncomingPreservingImages(existingRaw, cloneMapFromCloud(incoming)));
    });
    if (data.name){
      var t = teams.find(function(x){ return x.id===teamId; });
      if (t && t.name !== data.name) backend.renameTeam(teamId, data.name);
    }
    // Live mid-gesture preview (see pushLiveStroke/pushLiveAgentDrag below)
    // only matters for whichever map is actually open right now, and only
    // for the team currently being viewed — this same listener also runs
    // in the background for every OTHER shared team in the sidebar, whose
    // live data we simply ignore.
    if (teamId === selectedTeamId && selectedMapId){
      applyIncomingLive((data.live && data.live[selectedMapId]) || {});
    }
  }, function(err){ console.warn('cloud sync error', err); });
}
function stopCloudSync(teamId){
  if (cloudSubs[teamId]){ cloudSubs[teamId](); delete cloudSubs[teamId]; }
}

/** Pushes one map's freshly-saved data up to the shared doc, if this team is
 *  shared. Uses set(...,{merge:true}) with a real nested object (NOT a
 *  dotted-string key — that only means "nested path" for update(), not for
 *  set(..., {merge:true}), which stores a dotted string key as one literal
 *  field name) so pushing one map never clobbers another map's data another
 *  player just saved. */
function pushMapToCloud(teamId, mapId, payload){
  var team = teams.find(function(t){ return t.id===teamId; });
  if (!cloudEnabled || !team || !team.shareCode) return;
  var key = teamId + '|' + mapId;
  cloudLastApplied[key] = payload.updatedAt; // suppress the echo of our own write
  var patch = { maps: {}, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
  patch.maps[mapId] = cloneMapForCloud(payload);
  db.collection('sharedTeams').doc(team.shareCode).set(patch, {merge:true})
    .catch(function(err){ console.warn('cloud push failed', err); });
}

/** The ephemeral "live" layer: in-progress gestures (a stroke still being
 *  drawn, an agent marker still being dragged), broadcast at a throttled
 *  rate (LIVE_THROTTLE_MS) straight from pointermove and cleared the moment
 *  the gesture ends, when the *authoritative* commit (flushSave ->
 *  pushMapToCloud) takes over as usual. Deliberately a `live.<mapId>` field
 *  on the SAME shared team doc startCloudSync already reads/writes — a
 *  separate subcollection would need its own Firestore security rule (this
 *  project's rule only covers the sharedTeams/{code} document itself, not
 *  arbitrary subcollections under it — confirmed the hard way against the
 *  real project: a subcollection write came back "Missing or insufficient
 *  permissions"). Keyed by CLIENT_ID per-field so concurrent gestures from
 *  different players don't stomp each other, and so every receiver can
 *  filter out the echo of its own broadcasts. */
function applyIncomingLive(liveForMap){
  var strokesByClient = liveForMap.strokes || {};
  var agentsByClient = liveForMap.agentDrags || {};
  var abilitiesByClient = liveForMap.abilityDrags || {};
  var strokesOut = [];
  Object.keys(strokesByClient).forEach(function(cid){
    if (cid === CLIENT_ID) return; // ignore our own echo
    var s = strokesByClient[cid];
    if (!s) return;
    strokesOut.push({ clientId: cid, color: s.color, width: s.width, mode: s.mode, points: pointsFromCloud(s.points) });
  });
  var ghostsOut = [];
  Object.keys(agentsByClient).forEach(function(cid){
    if (cid === CLIENT_ID) return;
    var a = agentsByClient[cid];
    if (!a) return;
    ghostsOut.push({ clientId: cid, agentId: a.agentId, x: a.x, y: a.y });
  });
  var abilityGhostsOut = [];
  Object.keys(abilitiesByClient).forEach(function(cid){
    if (cid === CLIENT_ID) return;
    var ab = abilitiesByClient[cid];
    if (!ab) return;
    abilityGhostsOut.push({ clientId: cid, abilityId: ab.abilityId, x: ab.x, y: ab.y });
  });
  liveIncomingStrokes = strokesOut;
  liveIncomingAgentGhosts = ghostsOut;
  liveIncomingAbilityGhosts = abilityGhostsOut;
  refreshAllLiveDrawing();
}
/** Drops any live overlay left over from a map/team we've navigated away
 *  from, so a stale ghost or in-progress stroke can't linger on screen. */
function clearLiveOverlay(){
  if (!liveIncomingStrokes.length && !liveIncomingAgentGhosts.length && !liveIncomingAbilityGhosts.length) return;
  liveIncomingStrokes = [];
  liveIncomingAgentGhosts = [];
  liveIncomingAbilityGhosts = [];
  refreshAllLiveDrawing();
}
function liveTeamRef(){
  var team = teams.find(function(t){ return t.id===selectedTeamId; });
  if (!cloudEnabled || !team || !team.shareCode || !selectedMapId) return null;
  return { ref: db.collection('sharedTeams').doc(team.shareCode), mapId: selectedMapId };
}
function pushLiveStroke(strokeOrNull){
  var t = liveTeamRef();
  if (!t) return;
  var patch = { live: {} };
  patch.live[t.mapId] = { strokes: {} };
  patch.live[t.mapId].strokes[CLIENT_ID] = strokeOrNull ? {
    color: strokeOrNull.color, width: strokeOrNull.width, mode: strokeOrNull.mode,
    points: pointsToCloud(strokeOrNull.points)
  } : null;
  t.ref.set(patch, {merge:true}).catch(function(){});
}
function pushLiveAgentDrag(agentId, posOrNull){
  var t = liveTeamRef();
  if (!t) return;
  var patch = { live: {} };
  patch.live[t.mapId] = { agentDrags: {} };
  patch.live[t.mapId].agentDrags[CLIENT_ID] = posOrNull ? { agentId: agentId, x: posOrNull.x, y: posOrNull.y } : null;
  t.ref.set(patch, {merge:true}).catch(function(){});
}
function pushLiveAbilityDrag(abilityId, posOrNull){
  var t = liveTeamRef();
  if (!t) return;
  var patch = { live: {} };
  patch.live[t.mapId] = { abilityDrags: {} };
  patch.live[t.mapId].abilityDrags[CLIENT_ID] = posOrNull ? { abilityId: abilityId, x: posOrNull.x, y: posOrNull.y } : null;
  t.ref.set(patch, {merge:true}).catch(function(){});
}

function shareTeam(teamId, onDone){
  var team = teams.find(function(t){ return t.id===teamId; });
  if (!team || !cloudEnabled) { onDone && onDone(null, 'Sharing isn’t set up yet.'); return; }
  var code = genShareCode();
  var rawMaps = backend.getTeamMapsSnapshot(teamId);
  var cloudMaps = {};
  Object.keys(rawMaps).forEach(function(mapId){ cloudMaps[mapId] = cloneMapForCloud(rawMaps[mapId]); });
  db.collection('sharedTeams').doc(code).set({
    name: team.name,
    maps: cloudMaps,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    return backend.setShareCode(teamId, code);
  }).then(function(){
    startCloudSync(teamId, code);
    onDone && onDone(code, null);
  }).catch(function(err){
    console.warn('share failed', err);
    onDone && onDone(null, 'Couldn’t create the share link. Check your connection and try again.');
  });
}

function stopSharingTeam(teamId, onDone){
  var team = teams.find(function(t){ return t.id===teamId; });
  if (!team || !team.shareCode){ onDone && onDone(); return; }
  var code = team.shareCode;
  stopCloudSync(teamId);
  if (selectedTeamId === teamId) clearLiveOverlay();
  backend.setShareCode(teamId, null).then(function(){
    if (cloudEnabled) db.collection('sharedTeams').doc(code).delete().catch(function(){});
    onDone && onDone();
  });
}

function tryJoinFromUrl(){
  var params = new URLSearchParams(location.search);
  var code = (params.get('join') || '').trim().toUpperCase();
  if (!code) return;
  history.replaceState(null, '', location.pathname);
  if (!cloudEnabled){
    showModal({ title:'Sharing isn’t set up', body:'This copy of the app doesn’t have sharing configured yet. Ask whoever sent you this link to finish setting it up.', confirmLabel:'OK', onConfirm:function(){} });
    return;
  }
  var existing = teams.find(function(t){ return t.shareCode === code; });
  if (existing){ selectTeam(existing.id); return; }
  db.collection('sharedTeams').doc(code).get().then(function(snap){
    if (!snap.exists){
      showModal({ title:'Link not valid', body:'This share link doesn’t match a shared strat book — it may have been revoked. Ask for a fresh link.', confirmLabel:'OK', onConfirm:function(){} });
      return;
    }
    var data = snap.data() || {};
    var incomingMaps = data.maps || {};
    var normalizedMaps = {};
    Object.keys(incomingMaps).forEach(function(mapId){ normalizedMaps[mapId] = cloneMapFromCloud(incomingMaps[mapId]); });
    backend.addTeamWithData(data.name || 'Shared Team', code, normalizedMaps).then(function(id){
      startCloudSync(id, code);
      selectTeam(id);
    });
  }).catch(function(){
    showModal({ title:'Couldn’t open that link', body:'Something went wrong reaching the shared strat book. Check your connection and try again.', confirmLabel:'OK', onConfirm:function(){} });
  });
}

function showAttachSnapshotModal(snap){
  if (!mapData) return;
  var m = MAPS.find(function(x){ return x.id === mapData.mapId; });
  if (!m) return;
  var root = document.getElementById('modalRoot');

  var catOptions = CATEGORIES.map(function(c){
    return '<option value="' + c.key + '">' + esc(c.side.toUpperCase() + ' · ' + c.label) + '</option>';
  }).join('');
  var defaultCat = (CATEGORIES.find(function(c){ return c.side === selectedSide; }) || CATEGORIES[0]).key;

  root.innerHTML =
    '<div class="modal-backdrop" id="snapModalBackdrop">' +
      '<div class="modal snap-modal">' +
        '<h3>Save Diagram to Strat</h3>' +
        '<p>Pick which strat this diagram belongs to. You can attach it to an existing strat or start a new one — it syncs live to shared players, same as everything else.</p>' +
        '<div class="snap-modal-body">' +
          '<div class="snap-preview-wrap"><canvas id="snapPreviewCanvas" aria-label="Captured map diagram"></canvas></div>' +
          '<div class="snap-modal-form">' +
            '<div>' +
              '<span class="snap-field-label">CATEGORY</span>' +
              '<select id="snapCatSelect">' + catOptions + '</select>' +
            '</div>' +
            '<div>' +
              '<span class="snap-field-label">STRAT</span>' +
              '<select id="snapEntrySelect"></select>' +
            '</div>' +
            '<div class="snap-overwrite-warn" id="snapOverwriteWarn" hidden>This strat already has a diagram — saving will replace it.</div>' +
          '</div>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn" id="snapCancel">Cancel</button>' +
          '<button class="btn danger" id="snapSave">Save to Strat</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  renderSnapshotCanvas(document.getElementById('snapPreviewCanvas'), snap, m.minimap);

  var catSelect = document.getElementById('snapCatSelect');
  var entrySelect = document.getElementById('snapEntrySelect');
  var warnEl = document.getElementById('snapOverwriteWarn');
  catSelect.value = defaultCat;

  function populateEntries(){
    var catKey = catSelect.value;
    var entries = (mapData.categories[catKey] || []);
    var opts = entries.map(function(e, idx){
      var label = (e.title && e.title.trim()) ? e.title.trim() : ('Slot ' + (idx+1) + ' (untitled)');
      return '<option value="' + e.id + '">' + esc(label) + ((e.image || e.snapshot) ? ' 📷' : '') + '</option>';
    }).join('');
    opts += '<option value="__new__">+ New strat slot</option>';
    entrySelect.innerHTML = opts;
    updateWarn();
  }
  function updateWarn(){
    var catKey = catSelect.value;
    var val = entrySelect.value;
    var entries = (mapData.categories[catKey] || []);
    var entry = entries.find(function(e){ return e.id === val; });
    warnEl.hidden = !(entry && (entry.image || entry.snapshot));
  }

  populateEntries();
  catSelect.addEventListener('change', populateEntries);
  entrySelect.addEventListener('change', updateWarn);

  function close(){ root.innerHTML = ''; document.removeEventListener('keydown', onKey); }
  function onKey(e){ if (e.key === 'Escape') close(); }
  document.getElementById('snapCancel').addEventListener('click', close);
  document.getElementById('snapModalBackdrop').addEventListener('click', function(e){ if (e.target.id === 'snapModalBackdrop') close(); });
  document.addEventListener('keydown', onKey);

  document.getElementById('snapSave').addEventListener('click', function(){
    var catKey = catSelect.value;
    var val = entrySelect.value;
    var arr = mapData.categories[catKey];
    if (!arr) { close(); return; }
    var entry;
    if (val === '__new__'){
      entry = makeEntry();
      arr.push(entry);
    } else {
      entry = arr.find(function(e){ return e.id === val; });
    }
    if (entry){
      entry.snapshot = snap;
      entry.image = null; // a fresh save always replaces any old legacy raster photo
      scheduleSave();
      flushSave();
    }
    close();
    renderMapDetail();
  });
}
