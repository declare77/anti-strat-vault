<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anti-Strat Vault</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#0F1923;
  --bg-raised:#141F29;
  --bg-card:#1B2733;
  --bg-card-hover:#20303D;
  --border:#293743;
  --border-strong:#3B4C59;
  --text:#ECE8E1;
  --text-dim:#93A2AD;
  --text-faint:#5C6C78;
  --accent:#FF4655;
  --accent-dim:#7A2530;
  --accent-soft:rgba(255,70,85,.14);
  --defense:#4FD1C5;
  --defense-dim:#1E4643;
  --defense-soft:rgba(79,209,197,.14);
  --warn:#FFB454;
  --grid-line:rgba(255,255,255,.018);
  --font-display:'Rajdhani',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}

[data-theme="light"]{
  --bg:#F3F0E8;
  --bg-raised:#FFFFFF;
  --bg-card:#FFFFFF;
  --bg-card-hover:#ECE6D8;
  --border:#DED6C3;
  --border-strong:#C2B8A2;
  --text:#1B2733;
  --text-dim:#57626C;
  --text-faint:#828C96;
  --accent:#E23A49;
  --accent-dim:#B92E3B;
  --accent-soft:rgba(226,58,73,.10);
  --defense:#0E8F80;
  --defense-dim:#0B6E63;
  --defense-soft:rgba(14,143,128,.10);
  --warn:#A66A0A;
  --grid-line:rgba(27,39,51,.035);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  background-image:
    linear-gradient(var(--bg),var(--bg)),
    repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 42px);
  transition:background-color .15s ease, color .15s ease;
}
::selection{background:var(--accent-soft); color:var(--text);}
button{font:inherit;color:inherit;}
input,textarea{font:inherit;color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:6px;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance;}

.app{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:100vh;
}

/* ---------- SIDEBAR ---------- */
.sidebar{
  background:var(--bg-raised);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  min-height:100vh;
  padding:20px 0 14px;
}
.brand{
  padding:0 18px 18px;
  border-bottom:1px solid var(--border);
  margin-bottom:14px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.brand .kicker{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.14em;
  color:var(--accent);
  display:block;
  margin-bottom:2px;
}
.brand .title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:22px;
  letter-spacing:.02em;
  line-height:1.05;
}
.theme-toggle{
  background:none;
  border:1px solid var(--border-strong);
  color:var(--text-dim);
  width:30px;height:30px;flex:none;
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  margin-top:1px;
}
.theme-toggle:hover{color:var(--text); background:var(--bg-card-hover); border-color:var(--accent-dim);}
.theme-toggle .icon-moon{display:none;}
[data-theme="light"] .theme-toggle .icon-sun{display:none;}
[data-theme="light"] .theme-toggle .icon-moon{display:block;}

.sidebar-section-label{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.12em;
  color:var(--text-faint);
  padding:0 18px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.add-team-btn{
  background:none;
  border:1px solid var(--border-strong);
  color:var(--text-dim);
  width:22px;height:22px;
  border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:.15s;
}
.add-team-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}

.add-team-row{
  padding:0 14px 10px;
  display:flex;
  gap:6px;
}
.add-team-row input{
  flex:1;
  min-width:0;
  background:var(--bg-card);
  border:1px solid var(--accent-dim);
  color:var(--text);
  padding:7px 9px;
  border-radius:3px;
  font-size:13px;
}
.add-team-row input:focus{border-color:var(--accent);}
.add-team-submit{
  flex:none;
  width:30px;
  background:var(--accent);
  border:1px solid var(--accent);
  color:#0F1923;
  border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.add-team-submit:hover{background:#ff5b68; border-color:#ff5b68;}
.add-team-submit:disabled{opacity:.4; cursor:default; background:var(--accent); border-color:var(--accent);}

.team-list{
  flex:1;
  overflow-y:auto;
  padding:0 8px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.team-row{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 10px;
  border-radius:3px;
  cursor:pointer;
  border:1px solid transparent;
  color:var(--text-dim);
}
.team-row:hover{background:var(--bg-card); color:var(--text);}
.team-row.active{background:var(--accent-soft); border-color:var(--accent-dim); color:var(--text);}
.team-row .dot{
  width:6px;height:6px;background:var(--border-strong);flex:none;
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
}
.team-row.active .dot{background:var(--accent);}
.team-row .name{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13.5px;
  font-weight:500;
}
.team-row .row-actions{
  display:none;
  gap:2px;
  flex:none;
}
.team-row:hover .row-actions{display:flex;}
.icon-btn{
  background:none;border:none;color:var(--text-faint);
  width:22px;height:22px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-btn:hover{color:var(--text); background:var(--bg-card-hover);}
.icon-btn.danger:hover{color:var(--accent);}
.team-rename-input{
  flex:1;
  background:var(--bg);
  border:1px solid var(--accent);
  color:var(--text);
  padding:5px 7px;
  border-radius:3px;
  font-size:13.5px;
  min-width:0;
}
.empty-teams{
  padding:16px 14px;
  color:var(--text-faint);
  font-size:12.5px;
  line-height:1.6;
}

.sidebar-footer{
  padding:12px 18px 0;
  border-top:1px solid var(--border);
  margin-top:10px;
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--text-faint);
  letter-spacing:.02em;
  display:flex;
  align-items:center;
  gap:6px;
}
.sidebar-footer .pulse{
  width:6px;height:6px;border-radius:50%;background:var(--defense);flex:none;
}
.sidebar-footer.local .pulse{background:var(--warn);}

.backup-row{
  padding:9px 18px 0;
  display:flex;
  gap:7px;
}
.backup-btn{
  flex:1;
  display:flex; align-items:center; justify-content:center; gap:5px;
  background:var(--bg-card);
  border:1px solid var(--border-strong);
  color:var(--text-dim);
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:.05em;
  padding:6px 4px;
  border-radius:3px;
  cursor:pointer;
}
.backup-btn:hover{color:var(--text); background:var(--bg-card-hover); border-color:var(--accent-dim);}
.backup-status{
  padding:7px 18px 0;
  font-family:var(--font-mono);
  font-size:10.5px;
  line-height:1.5;
  color:var(--text-faint);
  min-height:1px;
}
.backup-status.error{color:var(--accent);}
.backup-status.ok{color:var(--defense);}

/* ---------- MAIN ---------- */
.main{display:flex; flex-direction:column; min-width:0;}
.topbar{
  padding:16px 28px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  min-height:26px;
}
.crumb{
  font-family:var(--font-display);
  font-weight:600;
  font-size:15px;
  color:var(--text-faint);
  background:none;border:none;cursor:pointer;
  padding:2px 0;
}
.crumb.current{color:var(--text); cursor:default;}
.crumb:hover:not(.current){color:var(--text);}
.crumb-sep{color:var(--border-strong); font-size:14px;}

.content{
  flex:1;
  padding:26px 28px 60px;
  overflow-y:auto;
}

/* ---------- WELCOME / EMPTY ---------- */
.welcome{
  max-width:760px;
}
.welcome h2{font-size:26px; margin-bottom:8px;}
.welcome p{color:var(--text-dim); max-width:520px; margin:0 0 22px;}
.welcome .cta{
  background:var(--accent);
  color:#0F1923;
  border:none;
  font-family:var(--font-display);
  font-weight:700;
  font-size:14px;
  letter-spacing:.02em;
  padding:11px 20px;
  border-radius:3px;
  cursor:pointer;
  clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 100%, 0 100%);
}
.welcome .cta:hover{background:#ff5b68;}
.example-tag{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.1em;
  color:var(--warn);
  border:1px solid var(--warn);
  padding:2px 8px;
  border-radius:2px;
  margin-bottom:14px;
}
.example-panel{
  border:1px solid var(--border);
  background:var(--bg-raised);
  border-radius:4px;
  padding:20px;
  opacity:.82;
  pointer-events:none;
  max-width:640px;
}
.example-panel .ex-head{
  display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;
}
.example-panel .ex-head h3{font-size:18px;}
.example-panel .ex-side{font-family:var(--font-mono); font-size:11px; color:var(--accent); letter-spacing:.1em;}
.example-panel .ex-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.example-panel .ex-card{background:var(--bg-card); border:1px solid var(--border); border-radius:3px; padding:10px 12px;}
.example-panel .ex-card .ex-slot{font-family:var(--font-mono); font-size:9.5px; color:var(--text-faint); letter-spacing:.08em;}
.example-panel .ex-card .ex-title{font-family:var(--font-display); font-weight:600; font-size:14px; margin:2px 0 4px;}
.example-panel .ex-card .ex-notes{font-size:12px; color:var(--text-dim); line-height:1.5;}

/* ---------- MAP GRID ---------- */
.grid-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
.grid-header h2{font-size:24px;}
.grid-header .overall{font-family:var(--font-mono); font-size:12px; color:var(--text-dim);}
.grid-header .overall b{color:var(--text);}

.map-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
  gap:14px;
}
.map-tile{
  position:relative;
  background:var(--bg-card) center/cover no-repeat;
  border:1px solid var(--border);
  padding:18px 16px 16px;
  cursor:pointer;
  clip-path:polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
  transition:.15s;
  display:flex; flex-direction:column; justify-content:flex-end; gap:10px;
  min-height:168px;
  isolation:isolate;
  overflow:hidden;
}
.map-tile::before{
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(15,25,35,.15) 0%, rgba(13,20,28,.55) 55%, rgba(11,17,23,.92) 100%);
  z-index:0;
  transition:.15s;
}
.map-tile:hover::before{background:linear-gradient(180deg, rgba(15,25,35,.05) 0%, rgba(13,20,28,.45) 55%, rgba(11,17,23,.88) 100%);}
.map-tile:hover{border-color:var(--border-strong);}
.map-tile > *{position:relative; z-index:1;}
.map-tile .map-name{font-family:var(--font-display); font-weight:700; font-size:21px; letter-spacing:.01em; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.5);}
.map-tile .map-meta{
  display:flex; align-items:center; justify-content:space-between;
  font-family:var(--font-mono); font-size:11px; color:rgba(236,232,225,.85);
}
.bar{height:4px; background:rgba(255,255,255,.16); border-radius:2px; overflow:hidden; margin-top:6px;}
.bar-fill{height:100%; background:var(--accent); border-radius:2px;}

/* ---------- MAP DETAIL ---------- */
.map-hero{
  position:relative;
  height:180px;
  margin:-26px -28px 24px;
  background:var(--bg-raised) center 35%/cover no-repeat;
  display:flex; align-items:flex-end;
  padding:20px 28px;
  isolation:isolate;
  overflow:hidden;
}
.map-hero::before{
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(15,25,35,.25) 0%, rgba(12,19,26,.55) 60%, var(--bg) 100%);
  z-index:0;
}
.map-hero-content{position:relative; z-index:1; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
.map-hero h2{font-size:32px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.55);}
.map-hero .hero-sub{font-family:var(--font-mono); font-size:12px; color:rgba(236,232,225,.8); letter-spacing:.08em;}

.map-body{display:grid; grid-template-columns:minmax(340px,640px) 1fr; gap:28px; align-items:start;}
.map-body-main{min-width:0;}
.minimap-panel{
  position:sticky;
  top:18px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:4px;
  padding:14px 14px 16px;
}
.minimap-panel .mp-head{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
}
.minimap-panel .mp-label{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; color:var(--text-faint);
}
.minimap-panel .mp-expand{
  background:none; border:1px solid var(--border-strong); color:var(--text-dim);
  width:26px; height:26px; border-radius:3px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.minimap-panel .mp-expand:hover{color:var(--text); background:var(--bg-card-hover); border-color:var(--accent-dim);}
.mp-head-actions{display:flex; align-items:center; gap:6px;}
.minimap-panel .mp-snapshot{
  background:none; border:1px solid var(--border-strong); color:var(--text-dim);
  height:26px; padding:0 10px; border-radius:3px; cursor:pointer;
  display:flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:10px; letter-spacing:.06em;
}
.minimap-panel .mp-snapshot:hover{color:var(--text); background:var(--bg-card-hover); border-color:var(--accent-dim);}
.minimap-panel .mp-snapshot:disabled{opacity:.5; cursor:default; background:none;}
.minimap-panel .mp-frame{
  background:#EDEAE2;
  border-radius:3px;
  overflow:hidden;
  display:block;
  position:relative;
  line-height:0;
}
.minimap-panel img{
  width:100%; display:block;
}
.mp-canvas{
  position:absolute; inset:0;
  width:100%; height:100%;
  touch-action:none;
  cursor:crosshair;
}
.minimap-panel.empty{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:320px; color:var(--text-faint); font-size:13px; text-align:center; gap:10px; padding:24px;
}
.minimap-panel.empty svg{opacity:.4;}
.minimap-panel.empty .mp-empty-sub{font-size:11.5px; max-width:220px; line-height:1.5;}

.lightbox-backdrop{
  position:fixed; inset:0; background:rgba(6,10,14,.86);
  display:flex; align-items:center; justify-content:center; z-index:60; padding:24px;
}
.lightbox-stage{display:flex; flex-direction:column; align-items:center; gap:16px; max-width:100%;}
.lightbox-frame{
  position:relative; display:inline-block; line-height:0;
  background:#EDEAE2; border-radius:4px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  max-width:90vw; max-height:70vh;
}
.lightbox-frame img{
  display:block; max-width:90vw; max-height:70vh; border-radius:4px;
}
.lightbox-close{
  position:absolute; top:20px; right:24px; background:var(--bg-raised); border:1px solid var(--border-strong);
  color:var(--text); width:36px; height:36px; border-radius:3px; cursor:pointer; z-index:2;
  display:flex; align-items:center; justify-content:center;
}
.lightbox-close:hover{border-color:var(--accent); color:var(--accent);}
.lightbox-cap{
  font-family:var(--font-display); font-weight:700; letter-spacing:.04em;
  color:var(--text); background:rgba(20,31,41,.85); border:1px solid var(--border);
  padding:7px 16px; border-radius:3px; font-size:14px;
}

/* ---------- DRAWING TOOLBAR ---------- */
.draw-toolbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:12px; padding-top:12px; border-top:1px solid var(--border);
}
.lightbox-frame ~ .draw-toolbar,
.lightbox-stage .draw-toolbar{
  border-top:none; margin-top:0; padding-top:0;
  background:var(--bg-raised); border:1px solid var(--border-strong);
  border-radius:4px; padding:10px 14px;
}
.draw-colors{display:flex; gap:6px;}
.draw-swatch{
  width:22px; height:22px; border-radius:50%; border:2px solid transparent;
  cursor:pointer; padding:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);
}
.draw-swatch.active{border-color:var(--text); box-shadow:0 0 0 2px var(--bg-card), inset 0 0 0 1px rgba(0,0,0,.2);}
.draw-tool-btn{
  background:none; border:1px solid var(--border-strong); color:var(--text-dim);
  width:28px; height:28px; border-radius:3px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex:none;
}
.draw-tool-btn:hover{color:var(--text); background:var(--bg-card-hover);}
.draw-tool-btn.active{color:#0F1923; background:var(--accent); border-color:var(--accent);}
.draw-thickness{display:flex; align-items:center; gap:8px; flex:1 1 110px; min-width:110px;}
.draw-thickness input[type=range]{
  flex:1; accent-color:var(--accent); height:4px; cursor:pointer;
}
.draw-width-readout{
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); width:32px; text-align:right;
}
.draw-toolbar .draw-divider{width:1px; align-self:stretch; background:var(--border-strong);}

/* ---------- AGENT TRAY + MARKERS ---------- */
.agent-tray{margin-top:12px;}
.agent-tray-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  margin-bottom:7px;
}
.agent-tray-label{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; color:var(--text-faint);
}
.agent-tray-label .side-attack{color:var(--accent);}
.agent-tray-label .side-defense{color:var(--defense);}
.agent-side-toggle{display:flex; gap:4px; flex:none;}
.agent-side-btn{
  font-family:var(--font-mono); font-weight:700; font-size:9.5px; letter-spacing:.06em;
  padding:4px 9px; border-radius:3px;
  background:var(--bg-card); border:1px solid var(--border); color:var(--text-faint);
  cursor:pointer;
}
.agent-side-btn:hover{color:var(--text);}
.agent-side-btn.active[data-agentside="attack"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
.agent-side-btn.active[data-agentside="defense"]{background:var(--defense-soft); border-color:var(--defense); color:var(--defense);}
.agent-tray-list{
  display:flex; flex-wrap:wrap; gap:6px;
  max-height:150px; overflow-y:auto;
  padding:8px; background:var(--bg-raised); border:1px solid var(--border); border-radius:4px;
}
.agent-chip{
  width:36px; height:36px; flex:none; padding:0;
  border-radius:50%; overflow:hidden;
  border:2px solid var(--border-strong);
  background:var(--bg-card);
  cursor:grab;
  touch-action:none;
}
.agent-chip:hover{border-color:var(--accent-dim);}
.agent-chip img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;}

.mp-agents-layer{position:absolute; inset:0; pointer-events:none;}
.mp-frame.agent-drop-target{outline:2px dashed var(--accent); outline-offset:-2px;}
.agent-marker{
  position:absolute;
  width:32px; height:32px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  overflow:visible;
  cursor:grab;
  pointer-events:auto;

    '<div class="draw-toolbar">' +

      '<button class="draw-tool-btn' + (drawTool.mode==='erase'?' active':'') + '" data-tool="erase" title="Eraser" aria-label="Eraser">' + ICON_ERASER + '</button>' +
      '<div class="draw-thickness"><input type="range" min="2" max="20" value="' + drawTool.width + '" class="draw-width-slider"><span class="draw-width-readout">' + drawTool.width + 'px</span></div>' +
      '<button class="draw-tool-btn" data-tool="undo" title="Undo last stroke" aria-label="Undo last stroke">' + ICON_UNDO + '</button>' +
      '<button class="draw-tool-btn" data-tool="clear" title="Clear drawing" aria-label="Clear all drawing">' + ICON_CLEAR + '</button>' +
    '</div>';
}

function buildAgentTrayHTML(){
  var chips = AGENTS.map(function(a){
    return '<button type="button" class="agent-chip" data-agent="' + a.id + '" title="' + esc(a.name) + '" aria-label="Drag ' + esc(a.name) + ' onto the map">' +
      '<img src="' + agentImgSrc(a.id) + '" alt="" draggable="false">' +
    '</button>';
  }).join('');
  return '' +
    '<div class="agent-tray">' +
      '<div class="agent-tray-head">' +
        '<div class="agent-tray-label">DRAG AGENTS ONTO THE MAP</div>' +
        '<div class="agent-side-toggle" role="group" aria-label="New marker color">' +
          '<button type="button" class="agent-side-btn' + (selectedAgentSide==='attack'?' active':'') + '" data-agentside="attack">ATTACK</button>' +
          '<button type="button" class="agent-side-btn' + (selectedAgentSide==='defense'?' active':'') + '" data-agentside="defense">DEFENSE</button>' +
        '</div>' +
      '</div>' +
      '<div class="agent-tray-list">' + chips + '</div>' +
    '</div>';
}

/** Wires a canvas overlay + toolbar found inside `root` to mapData.drawing.strokes.
 *  Returns the resize handler so the caller can remove it from window on teardown. */
function setupDrawing(root){
  var frame = root.querySelector('.mp-frame');
  var toolbar = root.querySelector('.draw-toolbar');
  if (!frame || !toolbar) return null;
  var img = frame.querySelector('img');
  if (!img) return null;

  var canvas = document.createElement('canvas');
  canvas.className = 'mp-canvas';
  frame.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  var cssW = 0, cssH = 0;
  var isDrawing = false;
  var current = null;

  function strokes(){
    if (!mapData) return [];
    if (!mapData.drawing) mapData.drawing = {strokes:[]};
    return mapData.drawing.strokes;
  }

  function paintStroke(stroke){
    if (!stroke.points || stroke.points.length < 1) return;
    ctx.globalCompositeOperation = stroke.mode === 'erase' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = stroke.color || DRAW_COLORS[0];
    ctx.lineWidth = Math.max(1, (stroke.width || 5) * (cssW / DRAW_REF_W));
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    stroke.points.forEach(function(p, i){
      var x = p[0] * cssW, y = p[1] * cssH;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    if (stroke.points.length === 1){
      var p0 = stroke.points[0];
      ctx.lineTo(p0[0]*cssW + 0.01, p0[1]*cssH + 0.01);
    }
    ctx.stroke();
  }

  function redraw(){
    ctx.clearRect(0, 0, cssW, cssH);
    strokes().forEach(paintStroke);
    if (current) paintStroke(current);
  }

  function resize(){
    var rect = img.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var dpr = window.devicePixelRatio || 1;
    cssW = rect.width; cssH = rect.height;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }

  function round4(n){ return Math.round(n*10000)/10000; }
  function pointFromEvent(e){
    var rect = canvas.getBoundingClientRect();
    var x = rect.width ? (e.clientX - rect.left) / rect.width : 0;
    var y = rect.height ? (e.clientY - rect.top) / rect.height : 0;
    return [round4(Math.min(1, Math.max(0, x))), round4(Math.min(1, Math.max(0, y)))];
  }

  // Drawing edits must not be clobbered by a snapshot that hasn't caught up
  // yet with a change we just made locally (e.g. an in-flight save racing a
  // db round-trip). Rather than guessing at a timeout, keep isEditing true
  // until the save we just triggered has actually round-tripped.
  var pendingDrawSaves = 0;
  function commitDrawChange(){
    isEditing = true;
    scheduleSave();
    pendingDrawSaves++;
    flushSave().then(settle, settle);
    function settle(){
      pendingDrawSaves = Math.max(0, pendingDrawSaves - 1);
      if (pendingDrawSaves === 0 && !isDrawing) isEditing = false;
    }
  }

  function endStroke(){
    if (!isDrawing) return;
    isDrawing = false;
    if (current && current.points.length > 0){
      strokes().push(current);
      commitDrawChange();
    } else if (pendingDrawSaves === 0){
      isEditing = false;
    }
    current = null;
    redraw();
  }

  canvas.addEventListener('pointerdown', function(e){
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    // Defensive re-size: if the minimap image finished loading after our
    // last resize() but before any window-resize/load event caught it,
    // this makes sure we're drawing against correct, current dimensions
    // rather than a stale/zeroed canvas.
    if (!cssW || !cssH) resize();
    if (!cssW || !cssH) return; // still not laid out — nothing sane to draw yet
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch(err){} }
    isDrawing = true;
    isEditing = true;
    current = { color: drawTool.color, width: drawTool.width, mode: drawTool.mode, points: [pointFromEvent(e)] };
    redraw();
  });
  canvas.addEventListener('pointermove', function(e){
    if (!isDrawing || !current) return;
    var pt = pointFromEvent(e);
    var last = current.points[current.points.length - 1];
    if (!last || Math.hypot((pt[0]-last[0])*cssW, (pt[1]-last[1])*cssH) > 1.2){
      current.points.push(pt);
      redraw();
    }
  });
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('lostpointercapture', endStroke);
  // Safety net: if the pointer is released outside the canvas and capture
  // didn't take for some reason, the stroke must still be committed —
  // otherwise it renders correctly until the next redraw, then vanishes.
  var windowPointerUp = function(){ if (isDrawing) endStroke(); };
  window.addEventListener('pointerup', windowPointerUp);
  window.addEventListener('blur', windowPointerUp);

  toolbar.querySelectorAll('.draw-swatch').forEach(function(btn){
    btn.addEventListener('click', function(){
      drawTool.color = btn.getAttribute('data-color');
      drawTool.mode = 'draw';
      syncToolbarUI();
    });
  });
  var eraseBtn = toolbar.querySelector('[data-tool="erase"]');
  eraseBtn.addEventListener('click', function(){
    drawTool.mode = 'erase';
    syncToolbarUI();
  });
  toolbar.querySelector('[data-tool="undo"]').addEventListener('click', function(){
    strokes().pop();
    commitDrawChange();
    redraw();
  });
  toolbar.querySelector('[data-tool="clear"]').addEventListener('click', function(){
    if (mapData && mapData.drawing) mapData.drawing.strokes = [];
    commitDrawChange();
    redraw();
  });
  var slider = toolbar.querySelector('.draw-width-slider');
  slider.addEventListener('input', function(){
    drawTool.width = +slider.value;
    toolbar.querySelector('.draw-width-readout').textContent = drawTool.width + 'px';
  });

  function syncToolbarUI(){
    toolbar.querySelectorAll('.draw-swatch').forEach(function(b){
      b.classList.toggle('active', drawTool.mode==='draw' && b.getAttribute('data-color')===drawTool.color);
    });
    eraseBtn.classList.toggle('active', drawTool.mode==='erase');
  }

  window.addEventListener('resize', resize);
  // The minimap image can still be loading (real network images especially)
  // when this panel is first built, so the very first resize() call above
  // may find a 0x0 rect and bail — leaving the canvas at its default pixel
  // size until something else happens to resize the window. Re-run resize()
  // once the image's real dimensions are actually available, so the canvas
  // gets sized correctly right away instead of only on the next accidental
  // window resize (which is also when old, wrongly-scaled strokes would
  // suddenly "pop back" at the correct size, looking like new strokes wipe
  // out old ones).
  img.addEventListener('load', resize);
  resize();

  /* ---------------- agent markers ---------------- */
  // Positions are stored as 0..1 fractions of the frame, same convention as
  // stroke points, so they stay correctly placed at any frame size without
  // needing their own resize handling (plain CSS percentages do that).

  var agentsLayer = document.createElement('div');
  agentsLayer.className = 'mp-agents-layer';
  frame.appendChild(agentsLayer);

  function agentsList(){
    if (!mapData) return [];
    if (!Array.isArray(mapData.agents)) mapData.agents = [];
    return mapData.agents;
  }
  function agentMeta(id){
    for (var i=0;i<AGENTS.length;i++){ if (AGENTS[i].id===id) return AGENTS[i]; }
    return {id:id, name:id};
  }
  function clampPct(n){ return Math.min(1, Math.max(0, n)); }

  function renderMarkers(){
    agentsLayer.innerHTML = '';
    agentsList().forEach(function(a){
      var meta = agentMeta(a.agent);
      var el = document.createElement('div');
      el.className = 'agent-marker side-' + a.side;
      el.style.left = (a.x*100) + '%';
      el.style.top = (a.y*100) + '%';
      el.innerHTML =
        '<img src="' + agentImgSrc(a.agent) + '" alt="' + esc(meta.name) + '" draggable="false">' +
        '<button type="button" class="agent-marker-remove" aria-label="Remove ' + esc(meta.name) + '" title="Remove ' + esc(meta.name) + '">' +
          '<svg width="9" height="9" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
        '</button>';
      agentsLayer.appendChild(el);
      wireMarkerDrag(el, a.id);
    });
  }

  function wireMarkerDrag(el, id){
    var dragging = false;
    function move(e){
      var rect = frame.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      var x = clampPct((e.clientX - rect.left) / rect.width);
      var y = clampPct((e.clientY - rect.top) / rect.height);
      var rec = agentsList().filter(function(a){ return a.id===id; })[0];
      if (!rec) return;
      rec.x = round4(x); rec.y = round4(y);
      el.style.left = (x*100) + '%';
      el.style.top = (y*100) + '%';
    }
    el.addEventListener('pointerdown', function(e){
      if (e.target.closest('.agent-marker-remove')) return;
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      dragging = true;
      try { el.setPointerCapture(e.pointerId); } catch(err){}
      el.classList.add('dragging');
    });
    el.addEventListener('pointermove', function(e){ if (dragging) move(e); });
    function finish(){
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      commitDrawChange();
    }
    el.addEventListener('pointerup', finish);
    el.addEventListener('pointercancel', finish);
    el.querySelector('.agent-marker-remove').addEventListener('click', function(e){
      e.stopPropagation();
      var list = agentsList();
      var idx = -1;
      for (var i=0;i<list.length;i++){ if (list[i].id===id){ idx = i; break; } }
      if (idx > -1){ list.splice(idx,1); commitDrawChange(); renderMarkers(); }
    });
  }

  renderMarkers();

  // Dragging an agent in from the tray. Built on Pointer Events (not the
  // HTML5 Drag and Drop API) so it works the same on touch as with a mouse.
  var tray = root.querySelector('.agent-tray');
  var ghostEl = null;
  var trayPointerId = null;

  function removeGhost(){
    if (ghostEl && ghostEl.parentNode) ghostEl.parentNode.removeChild(ghostEl);
    ghostEl = null;
  }
  function overFrame(e){
    var rect = frame.getBoundingClientRect();
    return rect.width>0 && e.clientX>=rect.left && e.clientX<=rect.right && e.clientY>=rect.top && e.clientY<=rect.bottom;
  }
  function trayMove(e){
    if (trayPointerId === null || e.pointerId !== trayPointerId) return;
    if (ghostEl){ ghostEl.style.left = e.clientX+'px'; ghostEl.style.top = e.clientY+'px'; }
    frame.classList.toggle('agent-drop-target', overFrame(e));
  }
  function trayEnd(e){
    if (trayPointerId === null || e.pointerId !== trayPointerId) return;
    trayPointerId = null;
    frame.classList.remove('agent-drop-target');
    if (ghostEl && overFrame(e)){
      var rect = frame.getBoundingClientRect();
      var x = clampPct((e.clientX - rect.left) / rect.width);
      var y = clampPct((e.clientY - rect.top) / rect.height);
      agentsList().push({id: genId('agent'), agent: ghostEl.getAttribute('data-agent'), side: selectedAgentSide, x: round4(x), y: round4(y)});
      commitDrawChange();
      renderMarkers();
    }
    removeGhost();
    window.removeEventListener('pointermove', trayMove);
    window.removeEventListener('pointerup', trayEnd);
    window.removeEventListener('pointercancel', trayEnd);
  }
  if (tray){
    Array.prototype.forEach.call(tray.querySelectorAll('.agent-chip'), function(chip){
      chip.addEventListener('pointerdown', function(e){
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        trayPointerId = e.pointerId;
        var agentId = chip.getAttribute('data-agent');
        ghostEl = document.createElement('div');
        ghostEl.className = 'agent-drag-ghost side-' + selectedAgentSide;
        ghostEl.setAttribute('data-agent', agentId);
        ghostEl.innerHTML = '<img src="' + agentImgSrc(agentId) + '" alt="">';
        ghostEl.style.left = e.clientX+'px';
        ghostEl.style.top = e.clientY+'px';
        document.body.appendChild(ghostEl);
        window.addEventListener('pointermove', trayMove);
        window.addEventListener('pointerup', trayEnd);
        window.addEventListener('pointercancel', trayEnd);
      });
    });
    Array.prototype.forEach.call(tray.querySelectorAll('.agent-side-btn'), function(btn){
      btn.addEventListener('click', function(){
        selectedAgentSide = btn.getAttribute('data-agentside');
        Array.prototype.forEach.call(tray.querySelectorAll('.agent-side-btn'), function(b){
          b.classList.toggle('active', b === btn);
        });
      });
    });
  }

  /* ---------------- save current view as an image ---------------- */
  // Renders the minimap image + every drawn stroke + every agent marker onto
  // an offscreen canvas at the minimap's native resolution — independent of
  // whatever size the panel happens to be on screen — so the saved photo
  // looks sharp whether it was captured from a phone or a wide desktop.
  function buildSnapshotDataUrl(){
    var outW = img.naturalWidth || cssW || 1024;
    var outH = img.naturalHeight || cssH || 1024;

    var out = document.createElement('canvas');
    out.width = outW; out.height = outH;
    var octx = out.getContext('2d');
    octx.drawImage(img, 0, 0, outW, outH);

    strokes().forEach(function(stroke){
      if (!stroke.points || stroke.points.length < 1) return;
      octx.globalCompositeOperation = stroke.mode === 'erase' ? 'destination-out' : 'source-over';
      octx.strokeStyle = stroke.color || DRAW_COLORS[0];
      octx.lineWidth = Math.max(1, (stroke.width || 5) * (outW / DRAW_REF_W));
      octx.lineCap = 'round';
      octx.lineJoin = 'round';
      octx.beginPath();
      stroke.points.forEach(function(p, i){
        var x = p[0]*outW, y = p[1]*outH;
        if (i === 0) octx.moveTo(x,y); else octx.lineTo(x,y);
      });
      if (stroke.points.length === 1){
        var p0 = stroke.points[0];
        octx.lineTo(p0[0]*outW + 0.01, p0[1]*outH + 0.01);
      }
      octx.stroke();
    });
    octx.globalCompositeOperation = 'source-over';

    var markers = agentsList();
    return Promise.all(markers.map(function(a){ return loadAgentImageEl(agentImgSrc(a.agent)); }))
      .then(function(icons){
        var r = Math.max(16, outW * 0.042);
        markers.forEach(function(a, i){
          var icon = icons[i];
          var cx = a.x*outW, cy = a.y*outH;
          octx.save();
          octx.beginPath();
          octx.arc(cx, cy, r, 0, Math.PI*2);
          octx.closePath();
          octx.clip();
          octx.fillStyle = '#0F1923';
          octx.fillRect(cx-r, cy-r, r*2, r*2);
          if (icon) octx.drawImage(icon, cx-r, cy-r, r*2, r*2);
          octx.restore();
          octx.beginPath();
          octx.arc(cx, cy, r, 0, Math.PI*2);
          octx.lineWidth = Math.max(2, r*0.16);
          octx.strokeStyle = a.side === 'defense' ? '#0E8F80' : '#E23A49';
          octx.stroke();
        });
        return out.toDataURL('image/png');
      });
  }

  var snapshotBtn = root.querySelector('#mpSnapshotBtn');
  if (snapshotBtn){
    snapshotBtn.addEventListener('click', function(){
      if (snapshotBtn.disabled) return;
      snapshotBtn.disabled = true;
      var label = snapshotBtn.querySelector('span');
      var prevLabel = label ? label.textContent : '';
      if (label) label.textContent = 'CAPTURING…';
      buildSnapshotDataUrl().then(function(dataUrl){
        showAttachSnapshotModal(dataUrl);
      }).catch(function(){
        showModal({ title:'Couldn’t save the image', body:'Something went wrong capturing the map. Please try again.', confirmLabel:'OK', onConfirm:function(){} });
      }).then(function(){
        snapshotBtn.disabled = false;
        if (label) label.textContent = prevLabel;
      });
    });
  }

  return function teardown(){
    window.removeEventListener('resize', resize);
    img.removeEventListener('load', resize);
    window.removeEventListener('pointerup', windowPointerUp);
    window.removeEventListener('blur', windowPointerUp);
    window.removeEventListener('pointermove', trayMove);
    window.removeEventListener('pointerup', trayEnd);
    window.removeEventListener('pointercancel', trayEnd);
    removeGhost();
  };
}

/* ---------------- helpers ---------------- */

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function genId(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function makeEntry(){ return {id: genId('entry'), title:'', notes:'', image:null}; }
function entryHasContent(e){ return !!((e.title && e.title.trim()) || (e.notes && e.notes.trim()) || e.image); }

function emptyMapData(mapId){
  var categories = {};
  // Every category starts empty — the coach adds exactly as many strat
  // slots as they actually want via the "+ Add" card in each category.
  CATEGORIES.forEach(function(c){ categories[c.key] = []; });
  return {mapId:mapId, categories:categories, drawing:{strokes:[]}, agents:[], updatedAt:null};
}

function normalizeMapData(mapId, raw){
  var base = emptyMapData(mapId);
  if (!raw) return base;
  CATEGORIES.forEach(function(c){
    var arr = raw.categories && raw.categories[c.key];
    // A brand-new map (no saved array for this category yet) keeps the
    // default seeded slots from emptyMapData. A saved array — even an
    // empty one, meaning the coach deleted every slot on purpose — is
    // used exactly as-is, at whatever length it happens to be, since
    // slots can now be added or removed freely.
    if (Array.isArray(arr)){
      base.categories[c.key] = arr.map(function(e){
        return {
          id: (e && e.id) || genId('entry'),
          title: (e && e.title) || '',
          notes: (e && e.notes) || '',
          image: (e && typeof e.image === 'string' && e.image) ? e.image : null
        };
      });
    }
  });
  if (raw.drawing && Array.isArray(raw.drawing.strokes)) base.drawing = {strokes: raw.drawing.strokes};
  if (Array.isArray(raw.agents)){
    base.agents = raw.agents.map(function(a){
      return {
        id: (a && a.id) || genId('agent'),
        agent: (a && a.agent) || AGENTS[0].id,
        side: (a && a.side === 'defense') ? 'defense' : 'attack',
        x: (a && typeof a.x === 'number') ? Math.min(1, Math.max(0, a.x)) : 0.5,
        y: (a && typeof a.y === 'number') ? Math.min(1, Math.max(0, a.y)) : 0.5
      };
    });
  }
  base.updatedAt = raw.updatedAt || null;
  return base;
}

function countFilled(mapData){
  if (!mapData) return 0;
  var n = 0;
  CATEGORIES.forEach(function(c){
    mapData.categories[c.key].forEach(function(e){
      if (entryHasContent(e)) n++;
    });
  });
  return n;
}

function totalSlots(mapData){
  if (!mapData) return 0;
  var n = 0;
  CATEGORIES.forEach(function(c){ n += mapData.categories[c.key].length; });
  return n;
}

function relTime(ts){
  if (!ts) return null;
  var d = Date.now() - ts;
  var m = Math.round(d/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  var h = Math.round(m/60);
  if (h < 24) return h + 'h ago';
  var days = Math.round(h/24);
  return days + 'd ago';
}

/* ---------------- storage backends ---------------- */

function makeLocalBackend(){
  var LS_KEY = 'antiStratVault_v1';
  function load(){
    try { var raw = JSON.parse(localStorage.getItem(LS_KEY)); return raw || {teams:{}, maps:{}}; }
    catch(e){ return {teams:{}, maps:{}}; }
  }
  function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
  var state = load();
  var teamListeners = [];
  var mapListeners = {};

  function teamList(){
    return Object.keys(state.teams).map(function(id){ return Object.assign({id:id}, state.teams[id]); })
      .sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  }
  function notifyTeams(){ teamListeners.forEach(function(cb){ cb(teamList()); }); }
  function notifyMap(teamId, mapId){
    var key = teamId+'|'+mapId;
    var data = state.maps[key] || null;
    (mapListeners[key]||[]).forEach(function(cb){ cb(data); });
  }

  return {
    kind:'local',
    subscribeTeams: function(cb){
      teamListeners.push(cb);
      cb(teamList());
      return function(){ teamListeners = teamListeners.filter(function(x){ return x!==cb; }); };
    },
    addTeam: function(name){
      var id = 'team_' + Math.random().toString(36).slice(2,10);
      state.teams[id] = {name:name, createdAt: Date.now()};
      persist(); notifyTeams();
      return Promise.resolve(id);
    },
    renameTeam: function(id, name){
      if (state.teams[id]){ state.teams[id].name = name; persist(); notifyTeams(); }
      return Promise.resolve();
    },
    deleteTeam: function(id){
      delete state.teams[id];
      Object.keys(state.maps).forEach(function(k){ if (k.indexOf(id+'|')===0) delete state.maps[k]; });
      persist(); notifyTeams();
      return Promise.resolve();
    },
    subscribeMap: function(teamId, mapId, cb){
      var key = teamId+'|'+mapId;
      mapListeners[key] = mapListeners[key] || [];
      mapListeners[key].push(cb);
      cb(state.maps[key] || null);
      return function(){ mapListeners[key] = (mapListeners[key]||[]).filter(function(x){ return x!==cb; }); };
    },
    saveMap: function(teamId, mapId, data){
      var key = teamId+'|'+mapId;
      state.maps[key] = data;
      persist(); notifyMap(teamId, mapId);
      return Promise.resolve();
    },
    exportSnapshot: function(){
      return state;
    },
    importSnapshot: function(data){
      var next = { teams:{}, maps:{} };
      if (data && typeof data === 'object'){
        if (data.teams && typeof data.teams === 'object') next.teams = data.teams;
        if (data.maps && typeof data.maps === 'object') next.maps = data.maps;
      }
      var affectedKeys = Object.keys(mapListeners);
      state = next;
      persist();
      notifyTeams();
      affectedKeys.forEach(function(key){
        var parts = key.split('|');
        notifyMap(parts[0], parts[1]);
      });
      return teamList().length;
    }
  };
}

function showAttachSnapshotModal(dataUrl){

        '<div class="snap-modal-body">' +
          '<div class="snap-preview-wrap"><img src="' + dataUrl + '" alt="Captured map snapshot"></div>' +
          '<div class="snap-modal-form">' +
            '<div>' +
              '<span class="snap-field-label">CATEGORY</span>' +
              '<select id="snapCatSelect">' + catOptions + '</select>' +
            '</div>' +
            '<div>' +
              '<span class="snap-field-label">STRAT</span>' +
              '<select id="snapEntrySelect"></select>' +
            '</div>' +
            '<div class="snap-overwrite-warn" id="snapOverwriteWarn" hidden>This strat already has a photo — saving will replace it.</div>' +
          '</div>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn" id="snapCancel">Cancel</button>' +
          '<button class="btn danger" id="snapSave">Save to Strat</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  var catSelect = document.getElementById('snapCatSelect');
  var entrySelect = document.getElementById('snapEntrySelect');
  var warnEl = document.getElementById('snapOverwriteWarn');
  catSelect.value = defaultCat;

  function populateEntries(){
    var catKey = catSelect.value;
    var entries = (mapData.categories[catKey] || []);
    var opts = entries.map(function(e, idx){
      var label = (e.title && e.title.trim()) ? e.title.trim() : ('Slot ' + (idx+1) + ' (untitled)');
      return '<option value="' + e.id + '">' + esc(label) + (e.image ? ' 📷' : '') + '</option>';
    }).join('');
    opts += '<option value="__new__">+ New strat slot</option>';
    entrySelect.innerHTML = opts;
    updateWarn();
  }
  function updateWarn(){
    var catKey = catSelect.value;
    var val = entrySelect.value;
    var entries = (mapData.categories[catKey] || []);
    var entry = entries.find(function(e){ return e.id === val; });
    warnEl.hidden = !(entry && entry.image);
  }

  populateEntries();
  catSelect.addEventListener('change', populateEntries);
  entrySelect.addEventListener('change', updateWarn);

  function close(){ root.innerHTML = ''; document.removeEventListener('keydown', onKey); }
  function onKey(e){ if (e.key === 'Escape') close(); }
  document.getElementById('snapCancel').addEventListener('click', close);
  document.getElementById('snapModalBackdrop').addEventListener('click', function(e){ if (e.target.id === 'snapModalBackdrop') close(); });
  document.addEventListener('keydown', onKey);

  document.getElementById('snapSave').addEventListener('click', function(){
    var catKey = catSelect.value;
    var val = entrySelect.value;
    var arr = mapData.categories[catKey];
    if (!arr) { close(); return; }
    var entry;
    if (val === '__new__'){
      entry = makeEntry();
      arr.push(entry);
    } else {
      entry = arr.find(function(e){ return e.id === val; });
    }
    if (entry){
      entry.image = dataUrl;
      scheduleSave();
      flushSave();
    }
    close();
    renderMapDetail();
  });
}

function renderMapGrid(){
  var team = teams.find(function(t){ return t.id===selectedTeamId; });
  if (!team) return;
  var totalFilled = MAPS.reduce(function(sum, m){ return sum + countFilled(gridData[m.id]); }, 0);
  var grandTotal = MAPS.reduce(function(sum, m){ return sum + totalSlots(gridData[m.id]); }, 0);

  var overallLabel = grandTotal ? (totalFilled + ' / ' + grandTotal + ' slots briefed') : 'No strats added yet';

  content.innerHTML =
    '<div class="grid-header">' +
      '<h2>' + esc(team.name) + '</h2>' +
      '<span class="overall">' + (grandTotal ? '<b>' + totalFilled + '</b> / ' + grandTotal + ' slots briefed' : overallLabel) + '</span>' +
    '</div>' +
    '<div class="map-grid">' +
      MAPS.map(function(m){
        var d = gridData[m.id];
        var filled = countFilled(d);
        var total = totalSlots(d);
        var pct = total ? Math.round((filled/total)*100) : 0;
        var metaLabel = total ? (filled + ' / ' + total + ' briefed') : 'No strats yet';
        var updated = d && d.updatedAt ? relTime(d.updatedAt) : null;
        return '<div class="map-tile" data-map="' + m.id + '" style="background-image:url(\'' + m.card + '\')">' +
          '<div class="map-name">' + esc(m.name) + '</div>' +
          '<div>' +
            '<div class="map-meta"><span>' + metaLabel + '</span>' + (updated ? '<span>' + updated + '</span>' : '<span>—</span>') + '</div>' +
            '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
}

function subscribeGrid(teamId){
  unsubscribeGrid();
  gridData = {};
  MAPS.forEach(function(m){
    var unsub = backend.subscribeMap(teamId, m.id, function(raw){
      gridData[m.id] = normalizeMapData(m.id, raw);
      if (selectedTeamId === teamId && !selectedMapId) renderMapGrid();
    });
    gridSubs.push(unsub);
  });
}
function unsubscribeGrid(){
  gridSubs.forEach(function(u){ u(); });
  gridSubs = [];
}

    var el = content.querySelector('[data-catcount="' + cat.key + '"]');
    if (!el) return;
    var entries = mapData.categories[cat.key];
    var filled = entries.filter(entryHasContent).length;
    el.textContent = entries.length ? (filled + ' / ' + entries.length) : 'No strats yet';
  });
}

function addStrat(catKey){
  if (!mapData || !mapData.categories[catKey]) return;
  var entry = makeEntry();
  mapData.categories[catKey].push(entry);
  scheduleSave();
  renderMapDetail();
  var titleEl = content.querySelector('.entry-card[data-entry-id="' + entry.id + '"] .entry-title');
  if (titleEl) titleEl.focus();
}

function deleteStrat(catKey, entryId){
  if (!mapData || !mapData.categories[catKey]) return;
  var arr = mapData.categories[catKey];
  var entry = arr.find(function(e){ return e.id === entryId; });
  if (!entry) return;
  var hasContent = (entry.title && entry.title.trim()) || (entry.notes && entry.notes.trim());

  function doDelete(){
    var i = arr.findIndex(function(e){ return e.id === entryId; });
    if (i === -1) return;
    arr.splice(i, 1);
    scheduleSave();
    renderMapDetail();
  }

  if (hasContent){
    var cat = CATEGORIES.find(function(c){ return c.key === catKey; });
    var label = entry.title && entry.title.trim() ? entry.title.trim() : (cat ? cat.slotWord : 'this strat');
    showModal({
      title: 'Delete “' + label + '”?',
      body: 'This removes the strat and its notes for good. This can’t be undone.',
      confirmLabel: 'Delete',
      danger: true,
      onConfirm: doDelete
    });
  } else {
    doDelete();
  }
}

/* ---------------- save flow ---------------- */

function scheduleSave(){
  dirty = true;
  updateSaveIndicatorEl('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 650);
}

function flushSave(){
  clearTimeout(saveTimer);
  if (!dirty || !selectedTeamId || !selectedMapId || !mapData) return Promise.resolve();
  var payload = {
    mapId: mapData.mapId,
    categories: mapData.categories,
    drawing: mapData.drawing || {strokes:[]},
    agents: mapData.agents || [],
    updatedAt: Date.now()
  };
  dirty = false;
  var teamId = selectedTeamId, mapId = selectedMapId;
  return backend.saveMap(teamId, mapId, payload).then(function(){
    if (selectedTeamId===teamId && selectedMapId===mapId) updateSaveIndicatorEl('saved');
  }).catch(function(err){
    console.warn('save failed', err);
    if (selectedTeamId===teamId && selectedMapId===mapId) updateSaveIndicatorEl('error');
  });
}

window.addEventListener('beforeunload', function(){ if (dirty) flushSave(); });

/* ---------------- navigation ---------------- */

function selectTeam(teamId){
  closeSidebarMobile();
  flushSave();
  unsubscribeMapDetail();
  unsubscribeGrid();
  selectedTeamId = teamId;
  selectedMapId = null;
  mapData = null;
  renderTeamList();
  renderTopbar();
  if (!teamId){
    renderWelcome();
    return;
  }
  gridData = {};
  MAPS.forEach(function(m){ gridData[m.id] = emptyMapData(m.id); });
  renderMapGrid();
  subscribeGrid(teamId);
}

function selectMap(mapId){
  flushSave();
  unsubscribeGrid();
  unsubscribeMapDetail();
  selectedMapId = mapId;
  selectedSide = 'attack';
  selectedAgentSide = 'attack';
  mapData = emptyMapData(mapId);
  renderTopbar();
  renderMapDetail();
  mapDetailSub = backend.subscribeMap(selectedTeamId, mapId, function(raw){
    var fresh = normalizeMapData(mapId, raw);
    if (isEditing){
      mapData.updatedAt = fresh.updatedAt;
      return;
    }
    mapData = fresh;
    renderMapDetail();
  });
}

function backToTeamGrid(){
  flushSave();
  unsubscribeMapDetail();
  selectedMapId = null;
  mapData = null;
  renderTopbar();
  gridData = {};
  MAPS.forEach(function(m){ gridData[m.id] = emptyMapData(m.id); });
  renderMapGrid();
  subscribeGrid(selectedTeamId);
}

function unsubscribeMapDetail(){
  if (mapDetailSub){ mapDetailSub(); mapDetailSub = null; }
}

function openAddTeam(){
  var row = document.getElementById('addTeamRow');
  row.style.display = 'flex';
  var input = document.getElementById('addTeamInput');
  input.value = '';
  document.getElementById('addTeamSubmit').disabled = true;
  input.focus();
}

function submitAddTeam(){
  var input = document.getElementById('addTeamInput');
  var val = input.value.trim();
  if (val){
    backend.addTeam(val).then(function(id){ selectTeam(id); });
  }
  document.getElementById('addTeamRow').style.display = 'none';
}

/* ---------------- event wiring ---------------- */

document.getElementById('addTeamBtn').addEventListener('click', openAddTeam);

var addTeamInput = document.getElementById('addTeamInput');
var addTeamSubmitBtn = document.getElementById('addTeamSubmit');

addTeamInput.addEventListener('input', function(){
  addTeamSubmitBtn.disabled = !addTeamInput.value.trim();
});
addTeamInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){
    submitAddTeam();
  } else if (e.key === 'Escape'){
    document.getElementById('addTeamRow').style.display = 'none';
  }
});
addTeamInput.addEventListener('blur', function(){
  setTimeout(function(){ document.getElementById('addTeamRow').style.display = 'none'; }, 120);
});
// mousedown fires before the input's blur, so this still reads the current value
addTeamSubmitBtn.addEventListener('mousedown', function(e){ e.preventDefault(); });
addTeamSubmitBtn.addEventListener('click', function(){
  submitAddTeam();
});

teamListEl.addEventListener('click', function(e){
  var actionBtn = e.target.closest('[data-action]');
  if (actionBtn){
    var teamId = actionBtn.getAttribute('data-team');
    var action = actionBtn.getAttribute('data-action');
    if (action==='rename') beginRenameTeam(teamId);
    else if (action==='delete') confirmDeleteTeam(teamId);
    return;
  }
  var row = e.target.closest('.team-row');
  if (row) selectTeam(row.getAttribute('data-team'));
});

topbar.addEventListener('click', function(e){
  if (e.target.closest('#sidebarToggle')){ openSidebarMobile(); return; }
  var btn = e.target.closest('[data-nav]');
  if (!btn) return;
  var nav = btn.getAttribute('data-nav');
  if (nav==='home') selectTeam(null);
  else if (nav==='team') backToTeamGrid();
});

/* ---------------- mobile sidebar drawer ---------------- */

function openSidebarMobile(){ document.querySelector('.app').classList.add('sidebar-open'); }
function closeSidebarMobile(){ document.querySelector('.app').classList.remove('sidebar-open'); }

document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebarMobile);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeSidebarMobile();
});

content.addEventListener('click', function(e){
  var tile = e.target.closest('.map-tile');
  if (tile){ selectMap(tile.getAttribute('data-map')); return; }
  var tab = e.target.closest('.side-tab');
  if (tab){
    flushSave();
    selectedSide = tab.getAttribute('data-side');
    renderMapDetail();
    return;
  }
  if (e.target.closest('#mpExpandBtn')){
    var m = MAPS.find(function(x){ return x.id===selectedMapId; });
    if (m && m.minimap) showLightbox(m.minimap, m.name);
    return;
  }
  var addCard = e.target.closest('.entry-add-card');
  if (addCard){
    addStrat(addCard.getAttribute('data-addcat'));
    return;
  }
  var delBtn = e.target.closest('.entry-delete');
  if (delBtn){
    deleteStrat(delBtn.getAttribute('data-cat'), delBtn.getAttribute('data-id'));
    return;
  }
  var removeImgBtn = e.target.closest('.entry-image-remove');
  if (removeImgBtn){
    e.stopPropagation();
    var rCat = removeImgBtn.getAttribute('data-cat'), rId = removeImgBtn.getAttribute('data-id');
    var rArr = mapData && mapData.categories[rCat];
    var rEntry = rArr && rArr.find(function(x){ return x.id === rId; });
    if (rEntry){ rEntry.image = null; scheduleSave(); renderMapDetail(); }
    return;
  }
  var thumb = e.target.closest('.entry-image-thumb');
  if (thumb){
    showStratImageModal(thumb.getAttribute('data-cat'), thumb.getAttribute('data-id'));
    return;
  }
});
content.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var thumb = e.target.closest('.entry-image-thumb');
  if (thumb){
    e.preventDefault();
    showStratImageModal(thumb.getAttribute('data-cat'), thumb.getAttribute('data-id'));
  }
});

content.addEventListener('input', function(e){
  var t = e.target;
  if (t.matches('.entry-title, .entry-notes')){
    var cat = t.dataset.cat, idx = +t.dataset.idx;
    if (mapData && mapData.categories[cat] && mapData.categories[cat][idx]){
      var field = t.classList.contains('entry-title') ? 'title' : 'notes';
      mapData.categories[cat][idx][field] = t.value;
      scheduleSave();
      refreshCatCounts();
    }
  }
});

content.addEventListener('focusin', function(e){
  if (e.target.matches('.entry-title, .entry-notes')) isEditing = true;
});
content.addEventListener('focusout', function(e){
  if (!e.target.matches('.entry-title, .entry-notes')) return;
  setTimeout(function(){
    var active = document.activeElement;
    if (!active || !active.matches || !active.matches('.entry-title, .entry-notes')){
      isEditing = false;
    }
  }, 0);
});

/* ---------------- export / import ---------------- */

function setupBackup(){
  var exportBtn = document.getElementById('exportBtn');
  var importBtn = document.getElementById('importBtn');
  var importFile = document.getElementById('importFile');
  var statusEl = document.getElementById('backupStatus');

  function setStatus(text, kind){
    statusEl.textContent = text;
    statusEl.className = 'backup-status' + (kind ? ' ' + kind : '');
  }

  function todayStamp(){
    var d = new Date();
    function pad(n){ return (n<10?'0':'')+n; }
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }

  function offerManualCopy(json, filename){
    var root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div class="modal-backdrop" id="modalBackdrop">' +
        '<div class="modal wide">' +
          '<h3>Copy your data</h3>' +
          '<p>Direct file saving isn’t available here. Copy everything below and save it into a text file named <strong>' + esc(filename) + '</strong> to bring to your other device.</p>' +
          '<textarea id="exportTextarea" readonly></textarea>' +
          '<div class="modal-actions">' +
            '<button class="btn" id="modalCancel">Close</button>' +
            '<button class="btn" id="modalCopyBtn">Copy to clipboard</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    var ta = document.getElementById('exportTextarea');
    ta.value = json;
    function close(){ root.innerHTML = ''; }
    document.getElementById('modalCancel').addEventListener('click', close);
    document.getElementById('modalBackdrop').addEventListener('click', function(e){ if (e.target.id==='modalBackdrop') close(); });
    document.getElementById('modalCopyBtn').addEventListener('click', function(){
      ta.focus(); ta.select();
      var done = function(){ setStatus('Copied — paste it into a new text file.', 'ok'); };
      var fail = function(){ try { document.execCommand('copy'); done(); } catch(e){ setStatus('Select the text and copy it manually.', 'error'); } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(done, fail);
      else fail();
    });
    setStatus('Copy the data from the dialog to move it manually.');
  }

  exportBtn.addEventListener('click', function(){
    if (!backend || !backend.exportSnapshot){ setStatus('Export isn’t available right now.', 'error'); return; }
    var snapshot = backend.exportSnapshot();
    var json = JSON.stringify({ app: 'anti-strat-vault', version: 1, exportedAt: Date.now(), data: snapshot }, null, 2);
    var filename = 'anti-strat-vault-' + todayStamp() + '.json';
    var useDownloads = window.claude && typeof window.claude.use === 'function';
    var dlPromise = useDownloads ? window.claude.use('downloads') : Promise.resolve(null);

    setStatus('Preparing export…');
    dlPromise.then(function(downloads){
      if (!downloads){ offerManualCopy(json, filename); return; }
      return downloads.save({ filename: filename, data: json }).then(function(){
        setStatus('Exported — bring that file to your other device and use Import.', 'ok');
      }).catch(function(err){
        var code = err && err.code;
        if (code === 'declined') setStatus('Export cancelled.');
        else if (code === 'rate_limited') setStatus('Give it a moment, then try exporting again.', 'error');
        else offerManualCopy(json, filename);
      });
    }).catch(function(){ offerManualCopy(json, filename); });
  });

  importBtn.addEventListener('click', function(){
    importFile.value = '';
    importFile.click();
  });

  importFile.addEventListener('change', function(){
    var file = importFile.files && importFile.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try { parsed = JSON.parse(String(reader.result)); }
      catch(e){ setStatus('That file isn’t valid — couldn’t read it as JSON.', 'error'); return; }
      var payload = (parsed && parsed.data && typeof parsed.data === 'object') ? parsed.data : parsed;
      if (!payload || typeof payload !== 'object' || (!payload.teams && !payload.maps)){
        setStatus('That doesn’t look like an Anti-Strat Vault export.', 'error');
        return;
      }
      var teamCount = payload.teams ? Object.keys(payload.teams).length : 0;
      showModal({
        title: 'Import ' + teamCount + ' team' + (teamCount===1?'':'s') + '?',
        body: 'This replaces everything currently saved in this browser with the contents of the file. This can’t be undone.',
        confirmLabel: 'Import and replace',
        danger: true,
        onConfirm: function(){
          selectTeam(null);
          var count = backend.importSnapshot(payload);
          setStatus('Imported ' + count + ' team' + (count===1?'':'s') + '.', 'ok');
        }
      });
    };
    reader.onerror = function(){ setStatus('Couldn’t read that file.', 'error'); };
    reader.readAsText(file);
  });
}

/* ---------------- theme ---------------- */

var THEME_KEY = 'antiStratVault_theme';

function setupTheme(){
  var btn = document.getElementById('themeToggle');
  if (!btn) return;

  function currentTheme(){
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }
  function updateLabel(){
    var isLight = currentTheme() === 'light';
    var label = isLight ? 'Switch to dark theme' : 'Switch to light theme';
    btn.title = label;
    btn.setAttribute('aria-label', label);
  }

  updateLabel();

  btn.addEventListener('click', function(){
    var next = currentTheme() === 'light' ? 'dark' : 'light';
    if (next === 'light'){
      document.documentElement.setAttribute('data-theme', 'light');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    try { localStorage.setItem(THEME_KEY, next); } catch(e){}
    updateLabel();
  });
}

/* ---------------- boot ---------------- */

function boot(){
  setupTheme();
  renderTopbar();
  renderWelcome();

  backend = makeLocalBackend();
  var footer = document.getElementById('sidebarFooter');
  footer.classList.add('local');
  document.getElementById('footerText').textContent = 'Saved to this browser only';

  unsubTeams = backend.subscribeTeams(function(list){
    teams = list;
    renderTeamList();
    renderTopbar();
    if (selectedTeamId && !teams.find(function(t){ return t.id===selectedTeamId; })){
      selectTeam(null);
    }
  });

  setupBackup();
}

boot();

})();
